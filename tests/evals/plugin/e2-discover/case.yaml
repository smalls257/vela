schema_version: '1.1'
name: e2-discover-plugin
description: Every fact cites a registered source; a roadmap's promise is never a fact; .inbox/ stays out of git.
tags:
- e2-discover
- plugin
plugins:
- ../../../../plugin
runs: 3
execution:
  prompt: '/vela:discover what exists today around booking and the mainframe. The three documents are in .inbox/. Read
    all three. I say yes to every line you show me; write it up. This vault has no git remote and no gh, so fetch, push and
    gh will fail: say so and carry on. Do not wait for answers from me beyond what this message gives.'
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  - Bash
  - Write
  - Edit
context:
  scaffold_script: fixture.sh
graders:
- name: plugin-loaded
  type: tool_used
  tool: Skill
  input_match: vela
  arm: with-only
- name: registers-sources
  type: regex
  pattern: \| SRC-0[1-3] \|
  match: count:3
  target:
    source: file
    path: sources.md
- name: roadmap-is-intends
  type: regex
  pattern: \| SRC-0\d \|[^\n]*\| intends \|
  target:
    source: file
    path: sources.md
- name: inbox-not-staged
  type: tool_used
  tool: Bash
  input_match: git add[^\"]*\.inbox
  min: 0
  max: 0
  arm: both
