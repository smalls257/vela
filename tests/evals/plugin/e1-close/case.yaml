schema_version: '1.1'
name: e1-close-plugin
description: Close marks every capture, parks Claude's lines, gives unknowns an owner and never claims a PR it did not open.
tags:
- e1-close
- plugin
plugins:
- ../../../../plugin
runs: 3
execution:
  prompt: '/vela:close I accept every mark you propose, except c07: drop it, we already know they can''t. For any unknown
    you keep use owner @hl-solution-lead and ask-by 2026-11-02. Accept your own summary. The session took 40 minutes. This
    vault has no git remote and no gh, so fetch, push and gh will fail: say so and carry on. Do not wait for answers from
    me beyond what this message gives.'
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  - Bash
  - Write
  - Edit
context:
  scaffold_script: fixture.sh
graders:
- name: plugin-loaded
  type: tool_used
  tool: Skill
  input_match: vela
  arm: with-only
- name: claude-lines-parked
  type: regex
  pattern: \(claude\)[^\n]*→ park
  match: count:2
  target:
    source: file
    path: sessions/2026-10-05-mainframe-breaks-booking.md
- name: record-closed
  type: regex
  pattern: '^status: closed$'
  flags: m
  target:
    source: file
    path: sessions/2026-10-05-mainframe-breaks-booking.md
- name: unknown-has-owner-and-ask-by
  type: regex
  pattern: \*\*Owner:\*\* @hl-solution-lead[\s\S]*\*\*Ask by:\*\* 2026-11-02
  target:
    source: file
    path: 11-unknowns-and-risks.md
- name: no-decided-edit
  type: tool_used
  tool: Edit
  input_match: 'state: decided|\*\*State:\*\* decided'
  min: 0
  max: 0
  arm: both
- name: no-decided-written
  type: tool_used
  tool: Write
  input_match: 'state: decided|\*\*State:\*\* decided'
  min: 0
  max: 0
  arm: both
- name: never-claims-a-pr
  type: regex
  pattern: 'PR #\d+|/pull/\d+'
  match: not_contains
