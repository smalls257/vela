schema_version: '1.1'
name: e4-shape-plugin
description: '"That''s decided" during a Shape gets a read-back, and with no yes after it the item stays not decided yet.'
tags:
- e4-shape
- plugin
plugins:
- ../../../../plugin
runs: 3
execution:
  prompt: '/vela:shape how kiosks could amend and cancel bookings after the March 2027 image. I like your second option
    best. That''s decided. This vault has no git remote and no gh, so fetch, push and gh will fail: say so and carry on. Do
    not wait for answers from me beyond what this message gives.'
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  - Bash
  - Write
  - Edit
context:
  scaffold_script: fixture.sh
graders:
- name: plugin-loaded
  type: tool_used
  tool: Skill
  input_match: vela
  arm: with-only
- name: no-decided-edit
  type: tool_used
  tool: Edit
  input_match: 'state: decided|\*\*State:\*\* decided'
  min: 0
  max: 0
  arm: both
- name: no-decided-write
  type: tool_used
  tool: Write
  input_match: 'state: decided|\*\*State:\*\* decided'
  min: 0
  max: 0
  arm: both
- name: offers-the-read-back
  type: regex
  pattern: \b(still yes|read (it|that) back|here's what i'll write)\b
  flags: i
