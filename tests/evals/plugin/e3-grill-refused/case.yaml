schema_version: '1.1'
name: e3-grill-refused-plugin
description: A grill on an item an open unknown blocks changes no page and offers another way forward.
tags:
- e3-grill-refused
- plugin
plugins:
- ../../../../plugin
runs: 3
execution:
  prompt: '/vela:grill CAP-021. I am the solution lead and I own it. This vault has no git remote and no gh, so fetch,
    push and gh will fail: say so and carry on. Do not wait for answers from me beyond what this message gives.'
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  - Bash
  - Write
  - Edit
context:
  scaffold_script: fixture.sh
graders:
- name: plugin-loaded
  type: tool_used
  tool: Skill
  input_match: vela
  arm: with-only
- name: no-page-edited
  type: tool_used
  tool: Edit
  input_match: '"file_path":"(?![^"]*sessions/)[^"]*\.md"'
  min: 0
  max: 0
  arm: both
- name: no-decided-written
  type: tool_used
  tool: Write
  input_match: 'state: decided|\*\*State:\*\* decided'
  min: 0
  max: 0
  arm: both
- name: no-override-written-by-edit
  type: tool_used
  tool: Edit
  input_match: '\*\*Override:\*\*'
  min: 0
  max: 0
  arm: both
- name: no-override-written-by-write
  type: tool_used
  tool: Write
  input_match: '\*\*Override:\*\*'
  min: 0
  max: 0
  arm: both
- name: names-the-blocker
  type: regex
  pattern: UNK-001
- name: offers-a-way-forward
  type: regex
  pattern: (?:\b(Shape session|ask with|an ask to|research task|decide (?:it )?anyway|override)\b|/vela:shape)
  flags: i
