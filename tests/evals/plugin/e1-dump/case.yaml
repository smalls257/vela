schema_version: '1.1'
name: e1-dump-plugin
description: 'A one-liner becomes captures only: no page edits, no decided, unknowns captured.'
tags:
- e1-dump
- plugin
plugins:
- ../../../../plugin
runs: 3
execution:
  prompt: '/planner:dump We need to stop the mainframe breaking booking. Every time the mainframe team changes a screen, the
    website, the call centre and the kiosks all break. The call centre fixes failed bookings by hand every morning. Nobody
    knows whether the mainframe team has time in Q1. This vault has no git remote and no gh, so fetch, push and gh will fail:
    say so and carry on. Do not wait for answers from me beyond what this message gives.'
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  - Bash
  - Write
  - Edit
context:
  scaffold_script: fixture.sh
graders:
- name: plugin-loaded
  type: tool_used
  tool: Skill
  input_match: planner
  arm: with-only
- name: writes-a-session-record
  type: tool_used
  tool: Write
  input_match: sessions/\d{4}-\d{2}-\d{2}-[a-z0-9-]+\.md
- name: no-page-written
  type: tool_used
  tool: Write
  input_match: '"file_path":"(?![^"]*sessions/)[^"]*\.md"'
  min: 0
  max: 0
  arm: both
- name: no-page-edited
  type: tool_used
  tool: Edit
  input_match: '"file_path":"(?![^"]*sessions/)[^"]*\.md"'
  min: 0
  max: 0
  arm: both
