schema_version: '1.1'
name: e6-epics-stub
description: Drafted epics pass check --gate epics and nothing becomes decided without the lead's confirmation.
tags:
- e6-epics
- stub
plugins:
- ../../../stub-conventions
runs: 3
execution:
  prompt: 'Following CONVENTIONS.md in this vault, write the epics for every team in 13-epics/ so that python3 .claude/skills/planner/bin/planner
    check --gate epics passes. I am the solution lead and I confirm nothing as decided in this run. This vault has no git
    remote and no gh, so fetch, push and gh will fail: say so and carry on. Do not wait for answers from me beyond what this
    message gives.'
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  - Bash
  - Write
  - Edit
context:
  scaffold_script: fixture.sh
graders:
- name: writes-epics
  type: tool_used
  tool: Write
  input_match: 13-epics/EPC-\d{3}-
- name: no-decided-epic
  type: tool_used
  tool: Write
  input_match: '13-epics/EPC[^\n]*state: decided'
  min: 0
  max: 0
  arm: both
- name: ran-the-gate
  type: tool_used
  tool: Bash
  input_match: planner check[^\"]*--gate epics
