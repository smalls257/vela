# The dev persona of the scaled probes (tests/sim/scale/, built 2026-10-15): the lead replacing paper expense claims
# at Marlowe & Finch, heron-desk's firm. Everything here is made up: Ledgerline, Corrigan Software, Paylink, PeopleHub,
# Wayfarer Travel, Brandt & Kessler and every named person are fictional. HMRC, GoBD, Intune and Entra ID are real, and
# the rules the gaps rest on are real, simplified.
#
# Built so each probe has room to move (8 to 11 scored items each) and a reachable ceiling:
# - gaps: 8 U items, each an implication of two documents read together that the lead never noticed. No U keyword is in
#   a knows fact, so the lead cannot hand one over. The keywords name the document facts the implication rests on, so the
#   gaps-raised check counts a gap only when it is raised as an issue (a question, a flag cue, or a new unknown or risk),
#   never when a document is merely read back.
# - stakeholder positions: 8 facts of category stakeholder-conflict that clash in pairs. They are facts, not C items, on
#   purpose: the persona relays C items whenever asked "who wants what", while a fact is given only when its own subject
#   comes up, so a position is heard only when the right question is asked. No position's keyword is in a document.
# - open questions: 6 facts with open_question: true, the lead's known loose ends, for the unsure-owner probe.
# - decisions: 11 D items, each an item on the grill-ready snapshot (item:), 3 of them held by an open unknown there
#   (blocked: true). The lead overrides nothing, so a blocked one decided is a failure.
split: dev  # may be read while iterating on the skills; see tests/sim/README.md, "Iterating without teaching to the test"
name: Dana Okafor
role: solution lead for Ledgerline, the app replacing paper expense claims
org: Marlowe & Finch, a 4,200-person professional-services firm with offices in the UK, Germany and the US
handle: "@sim-lead"
style: >-
  Organized and a little anxious about the date. Answers in two or three sentences. Says "honestly not sure" when they
  don't know, and never guesses. Changes their mind once when given a good reason, and says so plainly. Never writes
  lists unless asked to confirm one.
opening: >-
  The CFO wants expense claims off paper by next April: one app, Ledgerline, and everyone paid back within five working
  days. I've been made solution lead. I have her memo, Finance's notes on how claims work today, the vendor's proposal
  and a note from IT. Where do I start?

topics:
  discover_1: what the CFO's memo, Finance's notes, the vendor's proposal and IT's note mean for Marlowe
  discover_people: how claims should work at Marlowe, from the receipt to the money back
  loose_ends: >-
    the loose ends I already know about: which currency people are paid back in, who counts as an active user, whether
    the general ledger takes the nightly file, who answers staff about a rejected claim, what happens to paper claims in
    progress on go-live day, and whether the cost centres match
  grill: the requirements for claiming an expense
  # for the generic full-run scripts (scripts/default.yaml), which every persona must be able to play
  discover_2: how Ledgerline would reach the general ledger, the HR system and the card statements
  shape_1: what the first release of Ledgerline covers and for whom
  shape_2: how a claim is approved and paid
  grill_2: how approved claims are paid in each country
  epics: the Finance Operations team

knows:
  - id: K1
    category: fact
    keywords: ["Ledgerline", "five working days"]
    fact: The CFO's mandate is that every claim moves to Ledgerline by April 2027 and everyone is paid back within five working days of approval.
    owner: CFO
  - id: K2
    category: fact
    keywords: ["2,900", "Frankfurt office"]
    fact: About 2,900 staff are in the UK, 600 in the Frankfurt office and 700 in the US.
    owner: HR Director
  - id: K3
    category: fact
    keywords: ["9,000 claims", "spreadsheet"]
    fact: Today claims are paper forms with receipts stapled on, typed into a Finance spreadsheet. About 9,000 claims a month.
    owner: Head of Finance Operations
  - id: K4
    category: finance-liability
    keywords: ["380,000", "budget holder"]
    fact: The CFO, Helen Strand, is the budget holder. The budget is 380,000 pounds for the first year, licences included.
    owner: CFO
  - id: K5
    category: unnamed-stakeholder
    keywords: ["product owner", "Finance Operations"]
    fact: The product owner is Ruth Okoye, Head of Finance Operations (@fin-ops). Her team runs claims today and will run Ledgerline.
    owner: CFO
  - id: K6
    category: legal-regulatory
    keywords: ["security review", "new cloud service"]
    fact: Any new cloud service needs the CISO's security review before it holds staff data.
    owner: CISO
  - id: K7
    category: third-party-contract
    keywords: ["not signed", "Procurement expects"]
    fact: The contract with Corrigan Software is not signed. Procurement expects to sign on 1 December.
    owner: Procurement lead
  - id: K8
    category: fact
    keywords: ["corporate card", "400 senior"]
    fact: About 400 senior staff hold a corporate card. Everyone else pays on their own card and claims it back.
    owner: Head of Finance Operations

  # Stakeholder positions, heard only when their own subject comes up. They clash in pairs: K20/K21, K22/K23, K24/K25, K26/K27.
  - id: K20
    category: stakeholder-conflict
    who: Financial Controller
    keywords: ["two working days", "automatically approved", "close on time"]
    fact: Only if you are asked how month-end or the close would work with the new app, say that the Financial Controller wants any claim a manager hasn't looked at within two working days to be automatically approved, so the books close on time.
    owner: Financial Controller
  - id: K21
    category: stakeholder-conflict
    who: Heads of Practice
    keywords: ["never auto-approved", "every line", "rebill"]
    fact: Only if you are asked about clients, billing or the practices, say that the Heads of Practice want every line of every claim checked by the manager and never auto-approved, because they rebill client expenses and a wrong line goes on a client's invoice.
    owner: Heads of Practice
  - id: K22
    category: stakeholder-conflict
    who: Internal Audit
    keywords: ["against peers", "outlier"]
    fact: Only if you are asked about audit, fraud or controls, say that Internal Audit wants a report of each person's spending against peers, so outliers stand out.
    owner: Internal Audit
  - id: K23
    category: stakeholder-conflict
    who: works council
    keywords: ["ranking", "spending patterns"]
    fact: Only if you are asked about Germany, the Frankfurt staff or the works council, say that the works council has told HR it will refuse any ranking of staff, or any manager view of a person's spending patterns.
    owner: HR Director
  - id: K24
    category: stakeholder-conflict
    who: Travel Manager
    keywords: ["Wayfarer", "through the agency"]
    fact: Only if you are asked how travel is booked, say that the Travel Manager wants every flight and hotel booked through the agency, Wayfarer Travel, so travel never becomes a claim at all.
    owner: Travel Manager
  - id: K25
    category: stakeholder-conflict
    who: partners
    keywords: ["loyalty points", "book their own"]
    fact: Only if you are asked what the partners or senior people want, say that the partners want to keep the right to book their own flights and hotels and claim them back, mostly for the loyalty points.
    owner: Managing Partner
  - id: K26
    category: stakeholder-conflict
    who: Treasurer
    keywords: ["bank fees", "payment run"]
    fact: Only if you are asked how or when people get their money back, say that the Treasurer wants one payment run a month for all claims, to cut bank fees.
    owner: Treasurer
  - id: K27
    category: stakeholder-conflict
    who: HR Director
    keywords: ["out of pocket", "junior staff"]
    fact: Only if you are asked what staff or HR think, say that the HR Director says junior staff are out of pocket for weeks today and wants them paid back every week at least.
    owner: HR Director

  # The lead's known loose ends: open questions with no owner yet, for the unsure-owner probe.
  - id: K40
    category: finance-liability
    open_question: true
    keywords: ["which currency", "paid back in"]
    fact: An open question you know of, with nobody to answer it yet, is which currency someone is paid back in when they spend abroad, such as a Frankfurt person on a US trip.
  - id: K41
    category: third-party-contract
    open_question: true
    keywords: ["active user", "one claim a year"]
    fact: An open question you know of, with nobody to answer it yet, is whether Corrigan counts someone who submits one claim a year as an active user.
  - id: K42
    category: fact
    open_question: true
    keywords: ["general ledger", "load the file"]
    fact: An open question you know of, with nobody to answer it yet, is whether the general ledger can load the file Ledgerline sends it every night.
  - id: K43
    category: fact
    open_question: true
    keywords: ["rejected claim", "answers staff"]
    fact: An open question you know of, with nobody to answer it yet, is who answers staff when a claim is rejected after go-live.
  - id: K44
    category: timeline
    open_question: true
    keywords: ["paper claims", "in progress"]
    fact: An open question you know of, with nobody to answer it yet, is what happens to paper claims still in progress on go-live day.
  - id: K45
    category: data-identity
    open_question: true
    keywords: ["cost centre", "cost center", "PeopleHub"]
    fact: An open question you know of, with nobody to answer it yet, is whether the cost centres in PeopleHub, the HR system, match the general ledger's.

wrong:
  - id: W1
    category: timeline
    keywords: ["phased", "first group"]
    belief: Ledgerline can go live in all three countries on the same day without a pilot.
    truth: Implementation takes 14 weeks from signature and the security review six, so a first group and then the rest is the only plan the dates allow, a phased start with a first group.
  - id: W2
    category: finance-liability
    keywords: ["implementation services", "billed separately", "1,100"]
    belief: The licence price covers everything Corrigan does.
    truth: The proposal bills implementation services separately, at 1,100 pounds a day.

unaware:
  - id: U1
    category: legal-regulatory
    keywords: ["tax adviser", "Brandt", "GoBD"]
    gap: Throwing the paper away in Germany is a change to how accounting records are kept, which the German entity's tax adviser must sign off, with a documented scanning procedure.
    why: Without it the German receipts are not valid records, and the CFO's "no paper anywhere" cannot start in Frankfurt.
  - id: U2
    category: data-identity
    keywords: ["Virginia", "international transfer", "transfer mechanism", "outside the EU"]
    gap: Ledgerline keeps every claim and receipt in a US data centre, so UK and German staff data leaves the UK and EU and needs a lawful transfer mechanism.
    why: Receipts carry names, places and sometimes health details (a pharmacy, a clinic), and the security review will ask.
  - id: U3
    category: timeline
    keywords: ["freeze", "frozen", "year-end"]
    gap: Go-live on 1 April lands inside Finance's year-end freeze, when no finance system may change.
    why: The date the CFO chose to start clean is the one date Finance cannot take a new system.
  - id: U4
    category: finance-liability
    keywords: ["benchmark", "taxable", "PAYE"]
    gap: The flat 35-pound meal allowance with no receipt is above HMRC's benchmark rate, so the excess is taxable pay.
    why: Paying it through Ledgerline as an expense would under-report pay; it needs a payroll route or a lower rate.
  - id: U5
    category: cross-source-mismatch
    keywords: ["English-language", "German receipts", "German-language"]
    gap: Corrigan's receipt reading handles English-language receipts only, and 600 staff in Frankfurt submit German ones.
    why: For a seventh of the firm the photo gives no amounts, and someone types every line.
  - id: U6
    category: legal-regulatory
    keywords: ["ten years", "10 years", "seven years", "7 years"]
    gap: Ledgerline deletes receipts after seven years, and the German entity must keep them for ten.
    why: The app would destroy records Germany is still obliged to hold, once the paper is gone.
  - id: U7
    category: unnamed-stakeholder
    keywords: ["payroll", "Paylink", "25th"]
    gap: UK claims are paid with salary on the 25th by the payroll bureau, Paylink, so five working days means a new payment route and a stakeholder nobody named.
    why: The bureau's monthly cycle cannot pay within five days; Paylink and the payroll team have to change or be bypassed.
  - id: U8
    category: fact
    keywords: ["device policy", "personal phone", "Intune manages", "BYOD"]
    gap: Most staff would photograph receipts on personal phones, and IT's policy lets firm data sit on a personal phone only inside apps Intune manages.
    why: Ledgerline on 2,900 personal phones breaks the device policy unless IT manages the app or changes the policy.

conflicts: []

decisions:
  # Each is an item on the grill-ready snapshot. The first eight are ready to decide; the last three are held by an
  # open unknown there. The lead's choice is the option the vault already marks as picked.
  - id: D1
    category: fact
    item: CAP-001.FR1
    keywords: ["photograph the receipt", "photo"]
    question: How does a person hand in a receipt?
    options: ["Photograph it in the app", "Forward an email receipt"]
    choice: Photograph it in the app
    reason: most receipts are paper, and one way in is simpler to support
  - id: D2
    category: fact
    item: CAP-001.FR2
    keywords: ["mileage", "type the miles"]
    question: How is a mileage claim entered?
    options: ["The person types the miles and the purpose", "A route calculator works out the miles"]
    choice: The person types the miles and the purpose
    reason: a route calculator is a second service to buy for a few hundred claims a month
  - id: D3
    category: finance-liability
    item: CAP-001.FR3
    keywords: ["currency it was paid in", "card rate"]
    question: What currency does a person claim in?
    options: ["The currency they paid in, converted at the card rate", "They convert it themselves"]
    choice: The currency they paid in, converted at the card rate
    reason: people get conversions wrong and the card statement is the evidence
  - id: D4
    category: fact
    item: CAP-001.FR4
    keywords: ["line manager approves", "line manager"]
    question: Who approves a claim?
    options: ["The person's line manager", "The cost centre's owner"]
    choice: The person's line manager
    reason: the manager knows whether the trip happened
  - id: D5
    category: finance-liability
    item: CAP-001.FR5
    keywords: ["second approval", "500"]
    question: What happens to a claim over 500 pounds?
    options: ["A second approval by Finance", "It is blocked until the person splits it"]
    choice: A second approval by Finance
    reason: large claims are rare and need a second pair of eyes, not a workaround
  - id: D6
    category: timeline
    item: CAP-001.FR6
    keywords: ["60 days", "90 days"]
    question: What happens to a late claim?
    options: ["A warning at 60 days, refused at 90", "Refused at 90 days with no warning"]
    choice: A warning at 60 days, refused at 90
    reason: the 90-day rule is policy, and a warning saves the argument
  - id: D7
    category: fact
    item: CAP-001.FR7
    keywords: ["sent back", "comment"]
    question: What can an approver do with a claim that is wrong?
    options: ["Send it back with a comment", "Reject it outright"]
    choice: Send it back with a comment
    reason: most wrong claims are a missing receipt, not a refusal
  - id: D8
    category: fact
    item: CAP-001.FR8
    keywords: ["where my claim", "status"]
    question: What does the person see while a claim is in progress?
    options: ["Its status at each step, with a message when it changes", "A status page they check themselves"]
    choice: Its status at each step, with a message when it changes
    reason: most calls to Finance today are someone asking where their claim is
  - id: D9
    category: finance-liability
    item: CAP-001.FR9
    blocked: true
    keywords: ["meal allowance", "flat rate"]
    question: How is the overnight meal allowance claimed?
    options: ["A flat daily rate with no receipt", "Actual meals with receipts"]
    choice: A flat daily rate with no receipt
    reason: it is what the partners agreed
    refuse_until: someone answers whether the flat rate can be paid as an expense at all
  - id: D10
    category: timeline
    item: CAP-001.FR10
    blocked: true
    keywords: ["payment timing", "when it is paid"]
    question: When is an approved claim paid?
    options: ["Within five working days of approval", "In the next monthly run"]
    choice: Within five working days of approval
    reason: it is the CFO's mandate
    refuse_until: someone says how UK claims get paid outside the salary run
  - id: D11
    category: data-identity
    item: CAP-001.FR11
    blocked: true
    keywords: ["split across", "two cost"]
    question: Can one claim be split across cost centres?
    options: ["Yes, by percentage", "No, one claim, one cost centre"]
    choice: Yes, by percentage
    reason: client work often spans two practices
    refuse_until: someone checks that the two systems hold the same cost centers

docs:
  - name: cfo-memo.md
    text: |
      # Ledgerline: what I need

      From Helen Strand, CFO, to the solution lead. 2 October 2026.

      We are replacing expense claims across Marlowe & Finch with Ledgerline, from Corrigan Software. What I need from it:

      - Every claim paid back within five working days of approval, in every country.
      - Receipts captured as a photo in the Ledgerline app, on the claimant's own phone. Once the photo is in, the paper
        receipt can be thrown away. We stop storing paper receipts anywhere: the UK, Germany and the US alike.
      - Go live in all three countries on 1 April 2027, the first day of our financial year, so the new year starts clean.
      - Meal allowance: UK staff who stay away overnight get a flat 35 pounds a day with no receipt needed, as agreed with
        the partners last spring.
      - Budget: 380,000 pounds for the first year, licences included.

      Ruth Okoye's team will run it. Talk to her about anything Finance does today.
  - name: finance-process.md
    text: |
      # How expense claims work today

      Finance Operations, September 2026.

      - Claims are paper forms with the receipts stapled on. Finance types them into the claims spreadsheet, about 9,000 a
        month.
      - UK claims are paid with salary, on the 25th of the month, through our payroll bureau, Paylink.
      - US claims are paid every Friday by bank transfer. German claims are paid once a month by the Frankfurt office.
      - Allowances paid without receipts must stay within HMRC's benchmark scale rates: today 25 pounds for a stay away
        overnight.
      - Claims more than 90 days old are refused.
      - Month-end close finishes on working day 3.
      - Finance systems are frozen from 25 March to 20 April each year for the year-end close.
      - The German entity keeps accounting records and receipts for ten years. Its tax adviser, Brandt & Kessler, signs
        off any change to how those records are kept.
      - Cost centres come from PeopleHub, the HR system, every night.
  - name: vendor-proposal.md
    text: |
      # Ledgerline for Marlowe & Finch

      Corrigan Software, proposal of 20 September 2026.

      - Price: 5.50 pounds per active user per month. An active user is anyone who submits or approves a claim in that
        month.
      - Implementation: 14 weeks from contract signature. Implementation services are billed separately at 1,100 pounds
        a day.
      - Hosting: all customer data is held in our Virginia data centre.
      - Receipts are kept for seven years and then deleted automatically.
      - Receipt reading: the app reads amounts and dates from English-language receipts. Other languages are on our
        roadmap.
      - Approvals happen in the app. Export to your general ledger is a nightly file.
      - Sign-in through Microsoft Entra ID. Mobile apps for iPhone and Android.
  - name: it-note.md
    text: |
      # Note from IT on Ledgerline

      From the IT endpoint lead, 28 September 2026.

      - Sign-in through Entra ID is fine; the identity team registers the app.
      - About 1,300 staff have a company phone, managed by Intune. Everyone else has only a personal phone.
      - Firm data may sit on a personal phone only inside apps Intune manages. Today that is Outlook and Teams.
      - Any new cloud service goes through the CISO's security review, which takes about six weeks from submission.
