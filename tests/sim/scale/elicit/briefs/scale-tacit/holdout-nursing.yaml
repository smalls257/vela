# scale-tacit overlay for holdout-nursing (sealed: never read while iterating on the skills). Adds eight tacit facts
# to the persona's `knows:` for this probe only (probe_elicit.py): two dates, two owners, two unwritten rules and two
# past incidents (`tacit:` names the kind). The lead never volunteers one; each is given only to its kind's own
# question, to "what would a newcomer get wrong?" (dates, owners and rules), or to "what happened the last time?"
# (incidents). No keyword here is in a document, the opening or another item.
add:
  knows:
    - id: K60
      tacit: date
      category: timeline
      keywords: ["CQC", "May 2027"]
      fact: >-
        Only if the assistant asks whether any other dates, deadlines or busy times matter beyond the go-live date,
        or about the traps someone new here would fall into, say that the CQC inspection is expected in May 2027, and the Director of
        Nursing wants nothing half-finished when it comes. Never offer it otherwise, even when the talk comes near
        it: it is so normal to you that it doesn't seem worth saying.
      owner: Director of Nursing
    - id: K61
      tacit: date
      category: timeline
      keywords: ["flu campaign", "mid-October"]
      fact: >-
        Only if the assistant asks whether any other dates, deadlines or busy times matter beyond the go-live date,
        or about the traps someone new here would fall into, say that the flu campaign takes the nurses' spare time from mid-October
        to the end of November every year. Never offer it otherwise, even when the talk comes near it: it is so
        normal to you that it doesn't seem worth saying.
