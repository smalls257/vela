      take the Coach service at handoff, and own its runtime, its support and its epics.'
    owner: CTO
  - id: K30
    category: fact
    keywords:
    - ready track
    - three graded
    fact: '''Ready'' for the paper track means a reader has passed three graded paper trades on different stocks from the
