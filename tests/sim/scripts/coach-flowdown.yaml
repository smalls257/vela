team_repos:
  coach:
    title: Coach service
    skills:
    - tech-design-grill
    - work-breakdown
sessions:
- mode: requirements
  cap: 24
  planner: /planner:requirements
  baseline: 'Write the functional requirements for each capability the decided strategy needs, naming no app, with acceptance criteria. Follow CONVENTIONS.md.'
- mode: close
  cap: 12
  planner: /planner:close
