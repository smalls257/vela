  docs:
  - name: counsel-reply.md
    text: '# From outside counsel, 8 October


      Lessons and paper trading may launch once the marketing and any shown results are reviewed. A trade idea for a particular
      customer, this stock or this option now, is a recommendation: it is allowed only as Brightwater''s recommendation, under
      its Regulation Best Interest duty and its supervision. Kestrel must not trade on a customer''s behalf in the first release.
      Options lessons are education; a live options trade needs Brightwater''s options approval for that customer.'
  - name: ceo-note.md
    text: '# From the CEO, 6 October


      Release one is lessons and paper trading on a fixed list of US stocks. I accept that as the first release if the January
      board demo shows where it goes next. Trading for customers waits for a later release, after counsel and Brightwater
      sign off. Where compliance and I disagree, I decide once counsel has ruled.'
  - name: quoteline-reply.md
    text: '# From Quoteline, 7 October


      Showing delayed quotes inside lessons is display use, which your license allows. Using our prices to train or run a
      model is non-display use and needs an addendum with its own fees, as clause 9 says.'
  - name: agreement-read.md
    text: '# Partnerships: the signed Brightwater agreement, read in full, 8 October


      Equities only. Kestrel never holds customer money; Brightwater holds customers'' balances as its own customers'' money.
      Options need a separate options agreement. The sandbox covers all US-listed equities. Either side may exit with 90 days''
      notice.'
  - name: brightwater-reply.md
    text: '# From Brightwater Securities, 3 November


      The Coach service may send paper orders to the sandbox through the existing API, and may show Brightwater''s quotes
      inside its trade screens. Every lesson and screen shown to Brightwater customers goes through our content review first,
      which takes ten business days. Live options trading needs our options agreement and each customer''s options approval.'
  - name: answers-9-october.md
    text: '# Answers gathered by 9 October


      - ''Ready'' for the paper track means a reader has passed three graded paper trades on different stocks from the list
      and finished every lesson for them. The contracted lesson writer is Fieldnote Learning, starting 12 October. (Product
      lead)


      - The coach is offered to every TickerTalk reader, but only readers who opt in to the coach see lessons; release one
      targets the roughly 40,000 readers who use watchlists. (CEO)


      - The compliance consultant''s ruling is in writing, dated 2 October: no real order of any kind, including through Brightwater,
      until year one ends in March 2028; lessons and paper trading are allowed. (Compliance consultant)


      - Brightwater carries every customer balance as money it owes its own customers; Kestrel carries none, and paper balances
      are not money. (Partnerships manager)


      - The ML lead re-ran Signal against the S&P 500 total return with the stock list as it stood each year: the edge falls
      from 31% to about 2% a year before costs. Signal stays out of release one and the ML lead owns it. (ML lead)


      - The privacy review of 7 October says training Signal on readers'' watchlists or practice trades is a new purpose and
      needs fresh, opt-in consent; release one trains nothing on reader data. (Privacy lead)


      - Read in full: Brightwater''s section 7.2 makes every customer-facing lesson and screen subject to its content review,
      including demo builds shown outside Kestrel; Quoteline''s clause 9 allows display inside lessons and valuing paper positions
      on delayed quotes, and forbids training models without an addendum. (Partnerships manager)


      - In release one the coach never suggests a trade. Lesson copy explains how a trade works, using the fixed list; the
      compliance consultant signs off each lesson before Brightwater''s review. (Product lead)


      - Options are taught in release one as reading, never paper-traded, and come with no trade screen. (Product lead)


      - Counsel confirmed on 8 October that lessons are education, not marketing; only promotions and any shown results need
      marketing review. (Outside counsel)


      - TickerTalk has a backend on Kestrel''s AWS account, and the Coach service runs there; the Coach team runs it, with
      the platform engineer''s help for the first month. (CTO)


      - Coach keeps the record of each reader''s paper balance and trades; the Brightwater sandbox only fills the paper orders.
      If a reader later opens a real account, the paper record stays in Coach. (Coach lead)


      - TickerTalk identifies a signed-in reader by an opaque reader ID, not the email, and may send that ID to Coach. (Mobile
      lead)


      - Brightwater''s content review is run by its marketing compliance team; the contact is the review lead, reached through
      the partnerships manager''s shared channel. (Partnerships manager)


      - Brightwater will not shorten the ten-business-day review. A rejected item restarts the clock, with two rounds allowed
      before escalation. An internal demo shown only inside Kestrel is exempt; the board counts as inside Kestrel. (Partnerships
      manager)


      - The January demo is shown to the five board members and the CEO, inside Kestrel. (CEO)


      - The mobile lead confirmed the rendering tests fit before mobile sign-off without pushing other work. (Mobile lead)


      - Brightwater gives ten sandbox test accounts, run by its integration QA engineer. (Partnerships manager)


      - The Coach lead, @coach-lead, wrote in the Coach channel on 9 October: ''The four containers are right as written:
      Lessons, Paper practice, Quote display, Board demo. I''ll run Coach in business hours with an on-call rota from March,
      and I own its epics.'' (Coach lead)


      - The security review found no payment data and no real orders in Coach; reader IDs are opaque, and Coach stores practice
      records encrypted at rest. (Platform engineer)


      - Coach ships with request dashboards and alerts on errors and Brightwater sandbox failures, owned by the Coach team.
      (Coach lead)


      - Coach and TickerTalk run contract tests on both sides of the Coach entry and reader-identity contracts in each pipeline;
      Brightwater sandbox tests run nightly. (Coach lead)


      - Rollout is an opt-in beta for 2,000 watchlist readers in March, then everyone who opts in from April. (Product lead)


      - Coach''s running cost in year one, about 180,000 dollars including Quoteline display fees, sits inside the 2.5 million.
      (CFO)'
  - name: coach-lead-details.md
    text: '# From the Coach lead, in the Coach channel, 9 October


      The on-call rota goes live on 1 March, before the first beta reader. Calls to Coach time out after 3 seconds, calls
      to Quoteline after 2. A paper order may stay pending in the sandbox for 15 minutes; then Coach marks it failed and asks
      the sandbox for its status once. The four container names on the page are the names we use.

      '
  - name: privacy-opt-in.md
    text: '# From the privacy lead, 8 October


      Approved opt-in wording: "Coach keeps your lessons, practice trades and progress, under your reader ID, so you can pick
      up where you left off. Nothing is used to train any model."

      '
  - name: answers-later-9-october.md
    text: '# More answers, 9 October


      - The Coach lead wrote in the Coach channel on 9 October: the on-call rota goes live on 1 March, before the first beta
      reader. Calls to Coach time out after 3 seconds and calls to Quoteline after 2; a paper order may stay pending in the
      sandbox for 15 minutes, after which Coach marks it failed and asks the sandbox for its status once. (Coach lead)


      - The Coach lead confirmed on 9 October that the page''s four container names are the names the team uses: Lessons,
      Paper practice, Quote display, Board demo. (Coach lead)


      - The privacy lead approved the opt-in wording on 8 October: ''Coach keeps your lessons, practice trades and progress,
      under your reader ID, so you can pick up where you left off. Nothing is used to train any model.'' (Privacy lead)


      - The CFO is the named holder of the 2.5 million dollar budget and signs off spend over 50,000 dollars. (CFO)


      - The compliance consultant signs off two lessons a week and Brightwater reviews in ten business days, so the 24 beta
      lessons are cleared by 15 February, in time for the March beta. (Compliance consultant)


      - The Fieldnote Learning contract, held by the product lead, says Kestrel owns the lessons, either side may end it on
      30 days'' notice, and the compliance consultant checks each lesson before it is paid for. (Product lead)


      - A reader''s ID stays the same for the life of their account, across a change of email or a new device, and is never
      reused for another reader. (Mobile lead)


      - Mobile''s plan has TickerTalk check each reader''s opt-in before it sends the reader ID to Coach, and hide the coach
      screens for readers who have not opted in. (Mobile lead)


      - The platform engineer''s on-call rota covers TickerTalk''s backend, including the reader lookup, 24/7, and now lists
      Coach''s dependence on it. (Platform engineer)


      - Coach opens a reader''s sandbox paper account at their first practice trade. If opening it fails, the reader sees
      ''practice is unavailable, try again later'' and the lessons carry on. (Coach lead)


      - A paper trade is graded as passed when the reader states why they entered it, sets a stop, and closes it within the
      lesson''s rules. Three graded passes on different stocks pass the ready track. (Product lead)


      - The Coach lead owns the review of Coach''s failure cases during the build. (Coach lead)


      - The privacy lead who approved the opt-in wording is @privacy-lead. (Privacy lead)


      - When a reader withdraws from the coach, Coach keeps their record for 30 days so they can undo it, then deletes it.
      (Privacy lead)


      - Brightwater replied that it will not act as recommender or supervisor for trade ideas in year one; trade ideas stay
      out of release one. (Partnerships manager)


      - For TickerTalk, its existing security, cost, testing and observability practice holds unchanged except for the new
      contract tests on the coach entry; its rollout is the coach''s opt-in beta, and the mobile team owns it. (Mobile lead)'
  - name: quoteline-valuation.md
    text: '# From Quoteline, 9 October


      Valuing paper balances and positions on our delayed quotes is display use. It is inside your license and needs no addendum
      or fee.'
