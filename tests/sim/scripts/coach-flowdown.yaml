    owner: Mobile lead
  - id: K47
    category: fact
    keywords:
    - sandbox test accounts
    - Brightwater's QA
    fact: Brightwater gives ten sandbox test accounts, run by its integration QA engineer.
    owner: Partnerships manager
  - id: K48
    category: fact
    keywords:
    - Coach lead wrote
    - containers as written
    fact: 'The Coach lead, @coach-lead, wrote in the Coach channel on 9 October: ''The four containers are right as written:
