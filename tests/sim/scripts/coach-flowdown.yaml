    fact: In release one the coach never suggests a trade. Lesson copy explains how a trade works, using the fixed list; the
      compliance consultant signs off each lesson before Brightwater's review.
    owner: Product lead
  - id: K38
    category: fact
    keywords:
    - options lessons
