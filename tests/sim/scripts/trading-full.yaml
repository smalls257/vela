# Idea to handoff for the trading coach, in one run from an empty vault. News arrives while the work goes on:
# counsel's reply after the first grill closes (session 12), Brightwater's reply and the Coach team after the
# boundary session closes (session 18). Each brings the override a lead would then give once, with the reason.
# close's cap is 12: it now rewrites the prose of every page it changed and runs planner style until clean.
name: trading-full
persona: trading-coach
sessions:
- mode: dump
  cap: 14
  planner: /planner:dump {opening}
  baseline: I have a new initiative and nothing written down yet. Let's dump everything we know about it into this vault,
    following CONVENTIONS.md. {opening}
- mode: close
  cap: 12
  planner: /planner:close
  baseline: 'Close out this session: sort what we captured into the vault pages, commit it and open a PR, following CONVENTIONS.md.'
- mode: discover
  cap: 14
  planner: /planner:discover {topics[discover_1]}
  baseline: Read what exists today and record it. Follow CONVENTIONS.md.
- mode: close
  cap: 12
  planner: /planner:close
  baseline: 'Close out this session: sort what we captured into the vault pages, commit it and open a PR, following CONVENTIONS.md.'
- mode: shape
  cap: 12
  planner: /planner:shape {topics[shape_1]}
  baseline: Give me options for what the first release does. Follow CONVENTIONS.md.
- mode: close
  cap: 12
  planner: /planner:close
  baseline: 'Close out this session: sort what we captured into the vault pages, commit it and open a PR, following CONVENTIONS.md.'
- mode: discover
  cap: 14
  planner: /planner:discover {topics[discover_2]}
  baseline: Read about the Signal model, its data and its backtest, and record what exists. Follow CONVENTIONS.md.
- mode: close
  cap: 12
  planner: /planner:close
  baseline: 'Close out this session: sort what we captured into the vault pages, commit it and open a PR, following CONVENTIONS.md.'
- mode: shape
  cap: 12
  planner: /planner:shape {topics[shape_2]}
  baseline: Give me options for which instruments the coach teaches first. Follow CONVENTIONS.md.
- mode: close
  cap: 12
  planner: /planner:close
  baseline: 'Close out this session: sort what we captured into the vault pages, commit it and open a PR, following CONVENTIONS.md.'
- mode: grill
  cap: 16
  planner: /planner:grill {topics[grill]}
  baseline: Take me through what the first release does and record what I decide. Follow CONVENTIONS.md.
- mode: close
  cap: 12
  planner: /planner:close
  baseline: 'Close out this session: sort what we captured into the vault pages, commit it and open a PR, following CONVENTIONS.md.'
- mode: discover
  cap: 14
  planner: /planner:discover {topics[discover_3]}
  baseline: Read outside counsel's reply and record what it settles. Follow CONVENTIONS.md.
- mode: close
  cap: 12
  planner: /planner:close
  baseline: 'Close out this session: sort what we captured into the vault pages, commit it and open a PR, following CONVENTIONS.md.'
- mode: grill
  cap: 16
  planner: /planner:grill {topics[grill_2]}
  baseline: Take me through which instruments come first and where Signal sits, and record what I decide. Follow CONVENTIONS.md.
- mode: close
  cap: 12
  planner: /planner:close
  baseline: 'Close out this session: sort what we captured into the vault pages, commit it and open a PR, following CONVENTIONS.md.'
- mode: boundary
  cap: 24
  planner: /planner:boundary {topics[boundary]}
  baseline: 'Turn the decided first release into apps: who owns what, their contracts and how they fail. Follow CONVENTIONS.md.'
- mode: close
  cap: 12
  planner: /planner:close
  baseline: 'Close out this session: sort what we captured into the vault pages, commit it and open a PR, following CONVENTIONS.md.'
- mode: discover
  cap: 14
  planner: /planner:discover {topics[discover_4]}
  baseline: Read Brightwater's written reply and record what it settles. Follow CONVENTIONS.md.
- mode: close
  cap: 12
  planner: /planner:close
  baseline: 'Close out this session: sort what we captured into the vault pages, commit it and open a PR, following CONVENTIONS.md.'
- mode: grill
  cap: 22
  planner: /planner:grill {topics[grill_3]}
  baseline: Take me through the coach app's page and contracts and record what I decide. Follow CONVENTIONS.md.
- mode: close
  cap: 12
  planner: /planner:close
  baseline: 'Close out this session: sort what we captured into the vault pages, commit it and open a PR, following CONVENTIONS.md.'
- mode: epics
  cap: 20
  planner: /planner:epics {topics[epics]}
  baseline: Draft the epics for the Coach team. Follow CONVENTIONS.md.
- mode: close
  cap: 12
  planner: /planner:close
  baseline: 'Close out this session: sort what we captured into the vault pages, commit it and open a PR, following CONVENTIONS.md.'
- mode: grill
  cap: 16
  planner: /planner:grill {topics[grill_4]}
  baseline: Take me through handing the coach app to the Coach team and record it. Follow CONVENTIONS.md.
- mode: close
  cap: 12
  planner: /planner:close
  baseline: 'Close out this session: sort what we captured into the vault pages, commit it and open a PR, following CONVENTIONS.md.'
events:
- after: 12
  knows:
  - id: K15
    category: legal-regulatory
    keywords:
    - outside counsel
    - counsel's reply
    fact: 'Outside counsel replied on 20 October: lessons and paper trading may launch once marketing is reviewed. Any trade
      idea for a particular customer is a recommendation, allowed only under Brightwater''s supervision. No trading on a customer''s
      behalf in release one.'
    owner: Outside counsel
  docs:
  - name: counsel-reply.md
    text: '# From outside counsel, 20 October


      Lessons and paper trading may launch once the marketing and any shown results are reviewed. A trade idea for a particular
      customer, this stock or this option now, is a recommendation: it is allowed only as Brightwater''s recommendation, under
      its Regulation Best Interest duty and its supervision. Kestrel must not trade on a customer''s behalf in the first release.
      Options lessons are education; a live options trade needs Brightwater''s options approval for that customer.'
  decisions:
  - id: D1
    override_if_blocked: the CEO wants the January demo, and counsel's reply says the first release may go ahead as lessons
      and paper trading; the open questions go to the build team as named risks with owners
  - id: D2
    override_if_blocked: the CEO wants the January demo, and counsel's reply says the first release may go ahead as lessons
      and paper trading; the open questions go to the build team as named risks with owners
  - id: D4
    override_if_blocked: the CEO wants the January demo, and counsel's reply says the first release may go ahead as lessons
      and paper trading; the open questions go to the build team as named risks with owners
- after: 18
  knows:
  - id: K16
    category: third-party-contract
    keywords:
    - Brightwater replied
    - Brightwater's reply
    - content review
    fact: 'Brightwater replied in writing on 3 November: the Coach service may send paper orders to the sandbox and show Brightwater''s
      quotes in its trade screens; every lesson goes through Brightwater''s content review, ten business days; live options
      need its options agreement.'
    owner: Partnerships manager
  - id: K17
    category: fact
    keywords:
    - Coach team
    - four engineers
    fact: 'The Coach team is formed: four engineers from the ML and mobile teams. Its lead will take the Coach service at
      handoff and own its epics.'
    owner: CTO
  docs:
  - name: brightwater-reply.md
    text: '# From Brightwater Securities, 3 November


      The Coach service may send paper orders to the sandbox through the existing API, and may show Brightwater''s quotes
      inside its trade screens. Every lesson and screen shown to Brightwater customers goes through our content review first,
      which takes ten business days. Live options trading needs our options agreement and each customer''s options approval.'
  decisions:
  - id: D5
    override_if_blocked: the CEO wants the January demo, and counsel's reply says the first release may go ahead as lessons
