  - id: D7
    override_if_blocked: the CEO wants the January demo, and counsel's reply says the first release may go ahead as lessons
      and paper trading; the open questions go to the build team as named risks with owners
  - id: D8
    override_if_blocked: the CEO wants the January demo, and counsel's reply says the first release may go ahead as lessons
      and paper trading; the open questions go to the build team as named risks with owners
