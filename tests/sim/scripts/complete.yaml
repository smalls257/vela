# The complete pipeline: the full script, then Group Account taken through boundaries, contracts and handoff to epics.
name: complete
sessions:
  - mode: dump
    cap: 14
    planner: "/planner:dump {opening}"
    baseline: "I have a new initiative and nothing written down yet. Let's dump everything we know about it into this vault, following CONVENTIONS.md. {opening}"
  - mode: close
    cap: 8
    planner: "/planner:close"
    baseline: "Close out this session: sort what we captured into the vault pages, commit it and open a PR, following CONVENTIONS.md."
  - mode: discover
    cap: 14
    planner: "/planner:discover {topics[discover_1]}"
    baseline: "Let's find out what exists today: {topics[discover_1]}. The documents I have are in .inbox/. Record what is really there, following CONVENTIONS.md."
  - mode: close
    cap: 8
    planner: "/planner:close"
    baseline: "Close out this session: sort what we found into the vault pages, commit it and open a PR, following CONVENTIONS.md."
  - mode: shape
    cap: 12
    planner: "/planner:shape {topics[shape_1]}"
    baseline: "Let's shape {topics[shape_1]}. Give me some options to react to, following CONVENTIONS.md."
  - mode: close
    cap: 8
    planner: "/planner:close"
    baseline: "Close out this session: record the option we picked and the ones we turned down, commit it and open a PR, following CONVENTIONS.md."
  - mode: discover
    cap: 14
    planner: "/planner:discover {topics[discover_2]}"
    baseline: "Let's find out what exists today about {topics[discover_2]}. Use the documents in .inbox/ and what I know. Record it following CONVENTIONS.md."
  - mode: close
    cap: 8
    planner: "/planner:close"
    baseline: "Close out this session: sort what we found into the vault pages, commit it and open a PR, following CONVENTIONS.md."
  - mode: shape
    cap: 12
    planner: "/planner:shape {topics[shape_2]}"
    baseline: "Let's shape {topics[shape_2]}. Give me some options to react to, following CONVENTIONS.md."
  - mode: close
    cap: 8
    planner: "/planner:close"
    baseline: "Close out this session: record the option we picked and the ones we turned down, commit it and open a PR, following CONVENTIONS.md."
  - mode: grill
    cap: 16
    planner: "/planner:grill {topics[grill]}"
    baseline: "Let's make the decisions on {topics[grill]}. Grill me on them one at a time and record what we decide, following CONVENTIONS.md."
  - mode: close
    cap: 8
    planner: "/planner:close"
    baseline: "Close out this session: record what we decided, commit it and open a PR, following CONVENTIONS.md."
  - mode: grill
    cap: 16
    planner: "/planner:grill {topics[grill_2]}"
    baseline: "Let's decide which identity provider fronts the one login. Take me through the options and record what I decide, following CONVENTIONS.md."
  - mode: close
    cap: 8
    planner: "/planner:close"
    baseline: "Close out this session: sort what we captured into the vault pages, commit it and open a PR, following CONVENTIONS.md."
  - mode: discover
    cap: 14
    planner: "/planner:discover {topics[discover_3]}"
    baseline: "Read what the systems can integrate with and record what exists, following CONVENTIONS.md."
  - mode: close
    cap: 8
    planner: "/planner:close"
    baseline: "Close out this session: sort what we captured into the vault pages, commit it and open a PR, following CONVENTIONS.md."
  - mode: shape
    cap: 12
    planner: "/planner:shape {topics[shape_3]}"
    baseline: "Give me options for which app owns the one login and what it offers, following CONVENTIONS.md."
  - mode: close
    cap: 8
    planner: "/planner:close"
    baseline: "Close out this session: sort what we captured into the vault pages, commit it and open a PR, following CONVENTIONS.md."
  - mode: grill
    cap: 18
    planner: "/planner:grill {topics[grill_3]}"
    baseline: "Take me through the Group Account boundary and contracts and record what I decide, following CONVENTIONS.md."
  - mode: close
    cap: 8
    planner: "/planner:close"
    baseline: "Close out this session: sort what we captured into the vault pages, commit it and open a PR, following CONVENTIONS.md."
  - mode: epics
    cap: 18
    planner: "/planner:epics {topics[epics]}"
    baseline: "Write the epics for the first app that is ready, following CONVENTIONS.md."
  - mode: close
    cap: 8
    planner: "/planner:close"
    baseline: "Close out this session: sort what we captured into the vault pages, commit it and open a PR, following CONVENTIONS.md."
