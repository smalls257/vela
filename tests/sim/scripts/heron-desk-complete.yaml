# Heron from an empty vault to a near-complete plan (Task 29 of docs/plans/2026-10-14-cli-skill-overhaul.md). It is
# heron-desk-vela's run, which stays unchanged for the baseline and the mid-point runs, with what that run lacked to
# settle its plan: the people who hold the answers, and the sessions that decide.
#
# Sessions 1 to 16 are vela's lead sessions, dump to releases, with shorter closes. Then the lead brings seven
# outsiders in, one session each, the way a real lead books half an hour with each owner: the CISO, the DPO, legal
# counsel, the identity team lead, Microsoft's account contact, the pilot team lead and the works council's rep
# (tests/sim/personas/heron-<outsider>.yaml, named by each session's `persona:`). Each speaks for themselves and holds
# only the answers that are theirs. Then the deciding sessions: a sweep that resolves the unknowns the answers settle,
# a grill per app (its page, runtime and contracts to decided), a boundary that writes every slice's case tables and
# draws each flow strictly with vela check-slice, a grill over what check-slice still reports and the tracer, a pass
# over the unexamined concern cells, and one over the standard questions and unwritten pages. Last come vela's epics,
# handoff and the Desk Agent team's design, breakdown and tickets.
#
# Every answer comes from some persona's facts, each with its owner: the lead's news (vela's K16 to K34, plus what comes
# back after the releases, K35 to K54: the CIO's ruling, the product owner's dates, the endpoint lead's rings), two
# written rulings that reach the lead after the DPO's and Legal's sessions and lift the lead's refusals on D2 and D6,
# and the outsiders' own facts. `answers:` below maps every open unknown of the earlier Heron runs to the facts that
# answer it. The judge reads the outsiders' facts, so a fact one gave in the room is not counted as invented, and it
# still fails any fact nobody gave. Completeness is earned, not planted.
#
# The scorecard reads `vela status` on the final vault: its Completeness line, with the shares that held it back.
# `completeness_gate: 80` fails the run (exit 3) below 80%, the user's gate; the sessions aim at about 100%. A --stub run
# reports the gate and is never failed by it, since no model wrote its vault. The capture checks are vela's.
#
# Cost, for a Sonnet assistant at about $0.30 an assistant turn and a Haiku lead at about $0.02: the caps allow 612
# assistant turns over 54 sessions; sessions usually end by themselves at about 60% of the cap, so about 367 turns,
# $110 plus $7 of lead turns, against $117 of session spend: a budget of about $140 (less 15% for the judge). That is
# over the $80 U3 names. At $80 ($68 of sessions) the run stops in the first deciding sessions, about session 33, with
# the outsiders heard and little decided, so it would fail its own gate: run it at $140 or not at all. Every cap
# reached would need about $230. This costs money to run; tests/test_sim_complete.py runs it with --stub for nothing.
name: heron-desk-complete
persona: heron-desk
capture:
  release_date: '2027-02-02'
  ask: DPO
news:
  knows:
  - id: K16
    category: legal-regulatory
    keywords:
    - review slot
    - 4 December
    fact: 'The CISO booked a security review slot for the week of 16 November 2026, with the outcome due on 4 December. The
      pack must be submitted by 10 November, and no meeting text may leave a laptop until it passes.'
    owner: CISO
  - id: K17
    category: legal-regulatory
    keywords:
    - only people in the meeting
    - no sentiment
    fact: 'The DPO answered on 7 October: a digest may name only people who were in the meeting, never people merely mentioned,
      and it may carry no remark about anyone''s mood, tone or performance. This is the DPO''s answer, not the product owner''s.'
    owner: DPO
  - id: K18
    category: timeline
    keywords:
    - pilot starts
    - 1 June
    fact: 'The pilot starts on Tuesday 2 February 2027 for the 60 people in Client Delivery London. General availability is
      1 June 2027 for everyone except Frankfurt, if the review of the pilot on 15 April 2027 passes.'
    owner: CIO
  - id: K19
    category: fact
    keywords:
    - we call these areas
    - Capture, Insight and Trust
    fact: At Marlowe the areas of the work are called Capture, Insight and Trust. Everything that runs on the laptop and reads
      sources is Capture, everything that works out and delivers what matters is Insight, and consent, identity and admin
      are Trust. Nobody says Compliance.
    owner: CIO
  - id: K20
    category: fact
    keywords:
    - '@pilot-lead'
    - from client calls
    fact: 'The pilot team lead is Sam Hadley, @pilot-lead. Sam says about 70 percent of the team''s actions come out of client
      calls, and that the team would use Heron only if it worked on those.'
    owner: Pilot team lead
  - id: K21
    category: fact
    keywords:
    - packaging slot
    - 18 January
    fact: The IT endpoint lead, @endpoint-lead, says anything installed goes through Intune or Jamf. He will not allow a download
