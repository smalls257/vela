    category: legal-regulatory
    keywords:
    - steering group
    - release two question
    fact: 'The CIO ruled at the steering group on 13 October: release one keeps all meeting text on the laptop, as the CISO
      requires. Cloud summarization of redacted text is a release two question, open only if the DPO clears it and the CISO
      reviews it as a new step. The CIO settles this call as budget holder, and has settled it.'
    owner: CIO
  - id: K36
    category: stakeholder-conflict
    keywords:
    - copied the CIO
    - read it before
    fact: The CISO's note of 6 October was copied to the CIO the same day, and the CIO read it before the steering group.
    owner: CIO
  - id: K37
    category: fact
    keywords:
    - five pilot laptops
    - 90 seconds
    fact: 'The product owner ran the on-device trial on 12 October on five pilot laptops, 8 GB and no GPU: the small model
      wrote a digest in about 90 seconds and a prep note in about 40. Sam''s team rated 6 in 10 items useful, against the
      8 in 10 target. That trial and the staff survey are the only research there is; there is no design yet.'
    owner: Product owner
  - id: K38
    category: fact
    keywords:
