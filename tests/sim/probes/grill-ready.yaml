# Grill from a vault whose items the plan's own gate finds ready, some with an open question under them. Does the
# session decide them, each after the lead's explicit yes, rather than stalling? No item here is blocked now, so the
# `blocked` list is empty and the check only rules out deciding without a yes.
# grill-decisions could not tell: heron's after-full-1 held no ready item, so a grill that decided nothing passed.
# heron-desk/grill-ready is after-full-1 with a Shape's options written for three of the prep note's requirements
# (FR2, FR4, FR5). Since an open question under an item no longer blocks deciding it (settling notes it as
# `Decided with open`), `vela check --gate decide --item` finds all five requirements ready, so `blocked` is empty
# and the blocked-item measure is 0 of 0 here. The lead overrides nothing here.
snapshot:
  heron-desk: grill-ready
opening: "/vela:grill the prep note's requirements"
cap: 14
criteria:
  - check: decided-items
    decidable: [CAP-001.FR1, CAP-001.FR2, CAP-001.FR3, CAP-001.FR4, CAP-001.FR5]
    blocked: []
    at_least: 2
  - check: decided-without-yes
    at_most: 0
  - check: questions-per-turn
    at_most: 3
