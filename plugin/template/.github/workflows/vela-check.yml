# Runs vela check on every pull request. Make the "vela-check" job a
# required status check on main, so a red check blocks the merge.
# vela comes from its public repository (the "get vela" step), so a plan keeps no copy of the plugin.
name: vela check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  vela-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: get vela
        uses: actions/checkout@v4
        with:
          repository: smalls257/vela
          path: .vela/tool
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: vela check
        run: python .vela/tool/plugin/scripts/vela check
      - name: generated blocks are current
        run: python .vela/tool/plugin/scripts/vela render && git diff --exit-code
