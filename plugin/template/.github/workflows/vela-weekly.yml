# Every Monday, posts the vault's health as the one open issue titled
# "Vault health": stale pages and sources, overdue unknowns with their
# owners @-mentioned, and the days since the last session. It creates the
# issue the first time and edits it after that. A repository that holds
# several plans (`vela plans` lists them, one folder each) gets one issue per
# plan, titled "Vault health: <folder>", so one plan's owners are never
# mentioned about another's pages. GitHub runs workflows only from the
# repository's own .github/workflows/: a plan in a subfolder copies this file
# there once. Run it by hand from the
# Actions tab to see it at once. If gh fails, the job fails and shows red;
# it never reports success for an issue it did not write. Built and tested
# with a stand-in for gh; it has not yet run against a live repository.
# Two limits of GitHub to know: an edit pings only the owners added since the
# last run, because GitHub notifies on new mentions; and scheduled runs stop
# after two months with no activity in the repository.
# vela comes from its public repository (the "get vela" step), so a plan keeps no copy of the plugin.
name: vela weekly

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: vault-health
  cancel-in-progress: false

jobs:
  vault-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: get vela
        uses: actions/checkout@v4
        with:
          repository: smalls257/vela
          path: .vela/tool
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: List the plans
        run: python .vela/tool/plugin/scripts/vela plans --paths > plans.txt
      - name: Build the reports
        run: |
          n=0
          while IFS= read -r plan; do
            n=$((n + 1))
            python .vela/tool/plugin/scripts/vela health --vault "$plan" > "vault-health-$n.md"
          done < plans.txt
      - name: Open or update the Vault health issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          n=0
          while IFS= read -r plan; do
            n=$((n + 1))
            if [ "$plan" = "." ]; then TITLE="Vault health"; else TITLE="Vault health: $plan"; fi
            export TITLE
            number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title --jq '[.[] | select(.title == $ENV.TITLE) | .number] | first // empty')
            if [ -n "$number" ]; then
              gh issue edit "$number" --body-file "vault-health-$n.md"
            else
              gh issue create --title "$TITLE" --body-file "vault-health-$n.md"
            fi
          done < plans.txt
