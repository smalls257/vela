# The question catalog. Code reads it to work out which questions a vault owes: `vela questions`
# applies each entry once per subject its trigger matches, and `vela check` reads the answers in the
# ledger on 11-unknowns-and-risks.md. The model only decides how to ask. The format is in CONVENTIONS.md
# under "Questions and the ledger".
#
# Every entry cites the `why` that earned it a place: a regulation, a practice, or a miss in a simulated
# session. Keep the catalog
# small. Add an entry when a gap was found late or by luck, and prune one that nearly always ends
# not-applicable (`vela questions --stats` counts them). Bump `version` when entries change meaning.
version: 1

areas:
  FIN: Finance and liabilities
  DAT: Data and lawful basis
  PTN: Partners and contracts
  REG: Regulation and liability
  OPS: Operations and people

# The kinds of thing every plan needs, whatever its domain: the one list of "areas a plan must cover". A session's
# running topic map (`vela map`) tags what the lead says to a kind and points the next question at the emptiest kind
# near the last topic: the concern map of the October 16 elicitation research (OntoAgent, 2026, found 0.69 of
# hidden requirements with a map re-ranked each turn, against 0.13 free-form). `areas` names the focus areas above
# whose questions fall under the kind, so every area has a home here; `near` names the kinds a conversation on this
# one most often leads to (read both ways).
# A kind's name is what the lead hears ("nothing yet on money or dates"), so it is one plain word.
kinds:
  goals:
    means: what the plan is for, and how anyone would tell it worked
    areas: []
    near: [people, money, dates, risks]
  people:
    means: the groups affected, who has to say yes, and who would push back
    areas: [PTN, OPS]
    near: [owners, rules, systems]
  systems:
    means: the tools, apps and outside services the plan touches or changes
    areas: [OPS]
    near: [data, owners, risks]
  data:
    means: what information moves or is kept, and whose it is
    areas: [DAT]
    near: [systems, rules, people]
  rules:
    means: laws, contracts, policies and the unwritten rules people follow
    areas: [REG, PTN]
    near: [money, dates]
  dates:
    means: fixed dates, deadlines, seasons and renewals
    areas: []
    near: [owners, money]
  money:
    means: who pays, what it costs to run, and any value held for someone else
    areas: [FIN]
    near: [owners, risks]
  risks:
    means: what could go wrong, what went wrong last time, and what happens when a step fails
    areas: [REG]
    near: [owners]
  owners:
    means: who owns each piece, and who decides when people disagree
    areas: [OPS]
    near: []

entries:
  # ---------------------------------------------------------------- finance and liabilities
  - id: Q-FIN-01
    area: FIN
    scope: initiative
    trigger: exists
    question: Does anyone hold value on customers' behalf, such as points, credits, balances, vouchers or deposits?
    why: Three simulated full runs never asked about the loyalty balances, so a liability went unplanned. A yes creates the stored-value subject that Q-FIN-03 and Q-FIN-04 need.
    severity: high
    blocks: [decision, epic]
    creates: stored-value
    # A fact that says one of these words, with no stored value typed on the page, raises W809. Only the
    # forms written here match, so "pointer" and "balancing" never do. Phrases in mention_except are
    # removed first: they use the word for something that is not value held for a customer.
    mentions: [point/points, balance/balances, credit/credits/credited, voucher/vouchers, deposit/deposits/deposited]
    mention_why:
      point: Loyalty schemes count in points, and the scheme that held them was never typed in the simulated runs.
      balance: A balance is the usual name for value held on an account.
      credit: Credit held for a customer, such as a refund credit or a gift credit, is a liability.
      voucher: A voucher is value a customer holds until they spend it.
      deposit: A deposit is money held for a customer until the booking completes or is refunded.
    mention_except: [credit card*, balance the load, load balanc*, story point*, touch point*, data point*]
    group: existence

  - id: Q-FIN-02
    area: FIN
    scope: initiative
    trigger: exists
    question: Who pays for the change, and who carries its running cost once it is live?
    why: Enterprise-architecture practice treats existing contracts and running costs as constraints on the target state (Buckl et al., 2009). The simulated runs never named who carries what.
    severity: normal

  - id: Q-FIN-03
    area: FIN
    scope: stored-value
    trigger: exists
    question: Who carries these balances on the books as money owed to customers?
    why: Loyalty credit is deferred revenue, and breakage is recognized only when redemption becomes remote (RSM UK on IFRS 15). The simulated runs missed this liability every time.
    severity: high
    blocks: [decision, capability, epic]

  - id: Q-FIN-04
    area: FIN
    scope: stored-value
    trigger: exists
    question: Where stored value moves between schemes or systems, how does one balance convert into the other?
    why: The accounting for loyalty schemes "may depend on the details of the scheme" (RSM UK), so moving value between schemes is a finance decision before it is a system one.
    severity: normal
    blocks: [decision]

  - id: Q-FIN-05
    area: FIN
    scope: stored-value
    trigger: exists
    question: What happens to a balance at expiry or closure?
    why: Breakage is recognized only when redemption becomes remote (RSM UK on IFRS 15), so the rule for expiry and closure decides when a liability leaves the books.
    severity: normal
    blocks: [decision]

  - id: Q-FIN-06
    area: FIN
    scope: stored-value
    trigger: exists
    question: Who sets the rate at which a balance converts, and who approves it?
    why: A conversion rate moves money between customers and the business, so someone with finance authority has to own it. The simulated runs left the rate to whoever built the system.
    severity: normal
    blocks: [decision]

  # ---------------------------------------------------------------- data and lawful basis
  - id: Q-DAT-01
    area: DAT
    scope: initiative
    trigger: exists
    question: Will any data be used by a new party?
    why: The ICO's guidance on data sharing says to "establish the purposes for which the data was originally obtained" and the lawful basis for sharing it. A yes creates the party subject.
    severity: high
    blocks: [decision, contract, epic]
    creates: party
    group: existence

  - id: Q-DAT-05
    area: DAT
    scope: initiative
    trigger: exists
    question: Will any data be used for a purpose other than the one it was collected for?
    why: The ICO asks for the purposes the data was originally obtained for, and a lawful basis for any new one. A new purpose needs its own basis even when no new party appears.
    severity: high
    blocks: [decision, contract, epic]
    group: existence

  - id: Q-DAT-02
    area: DAT
    scope: app
    trigger: change in [new, changed]
    question: What customer data does it hold or receive, and on what lawful basis may it use that data?
    why: The ICO asks for a lawful basis for each new use of personal data. Each new or changed app is a new use until someone says otherwise.
    severity: high
    blocks: [app, contract, epic]

  - id: Q-DAT-03
    area: DAT
    scope: contract
    trigger: change in [new, changed, new consumers]
    question: Does customer data cross this boundary, and were its consumers named when the data was collected?
    why: The ICO says to "consider when and how you will inform data subjects". A new consumer of a contract is a new recipient of whatever data crosses it.
    severity: normal
    blocks: [contract]

  - id: Q-DAT-04
    area: DAT
    scope: stored-value
    trigger: exists
    question: Which one system is the record of each customer's balance?
    why: Simulated runs found balances that had to follow a customer across two systems when only one of them had a place to hold them. Every channel that shows a balance has to read the same record.
    severity: normal
    blocks: [capability]

  # ---------------------------------------------------------------- partners and contracts
  - id: Q-PTN-01
    area: PTN
    scope: initiative
    trigger: exists
    question: Does ownership, operation or payment change for anything, such as a system, an agreement, a team or a service?
    why: Change-of-control clauses can fire even when no asset moves (legal due-diligence practice). A yes creates the party subject that Q-PTN-02 and Q-PTN-03 need.
    severity: high
    blocks: [decision, contract, epic]
    creates: party
    mentions: [clause/clauses]
    mention_why:
      clause: A change-of-control or assignment clause lives in an agreement, so a clause in a fact points at a counterparty nobody typed.
    group: existence

  - id: Q-PTN-02
    area: PTN
    scope: party
    trigger: relationship in [partner, supplier]
    question: Does their agreement let us share data with a new owner or user of it?
    why: Data-sharing and confidentiality clauses decide whether a partner's data may pass to anyone new. The simulated runs missed partner contracts that blocked sharing.
    severity: high
    blocks: [decision, contract, epic]

  - id: Q-PTN-05
    area: PTN
    scope: party
    trigger: relationship in [partner, supplier]
    question: Does their agreement let it be assigned, or change who controls it?
    why: Anti-assignment and change-of-control clauses can end or reprice an agreement when ownership moves, even if no asset does. Legal due-diligence practice reads them first.
    severity: high
    blocks: [decision, contract, epic]

  - id: Q-PTN-06
    area: PTN
    scope: party
    trigger: relationship in [partner, supplier]
    question: What notice does a change to their agreement need, and who must give it?
    why: A notice period that nobody tracks turns a planned date into a breach. The simulated runs never asked who had to give notice.
    severity: normal
    blocks: [decision]

  - id: Q-PTN-03
    area: PTN
    scope: party
    trigger: relationship in [partner, supplier]
    question: Who holds the agreement, when does it end, and what does leaving or changing it cost?
    why: Buckl et al. (2009) found that existing contracts "have a high influence on costs" when landscapes are combined.
    severity: normal
    blocks: [decision]

  - id: Q-PTN-04
    area: PTN
    scope: contract
    trigger: "provider: external and change in [new, changed]"
    question: Which agreement with the external provider covers this contract, and does the change stay inside it?
    why: A new or changed contract with an outside provider is bounded by an agreement the initiative does not own (Volere, "changes in the other organizations or systems on your context diagram").
    severity: normal
    blocks: [contract]

  # ---------------------------------------------------------------- regulation and liability
  - id: Q-REG-01
    area: REG
    scope: initiative
    trigger: exists
    question: Will any product be sold or promised across parties, such as a bundle or a joint offer?
    why: Some sectors make parties jointly answerable for a product sold across them, e.g. EU 2021/782 for rail. The simulated runs missed liability for combined products.
    severity: normal
    blocks: [decision, epic]
    group: existence

  - id: Q-REG-05
    area: REG
    scope: initiative
    trigger: exists
    question: When one part of a product sold across parties fails, who is liable to the customer?
    why: A customer deals with the seller, not with the party that failed, so liability has to be placed before the product is sold. The simulated runs never asked who answers to the customer.
    severity: normal
    blocks: [decision, epic]
    follows: Q-REG-01

  - id: Q-REG-02
    area: REG
    scope: initiative
    trigger: exists
    question: Is anything in scope regulated or licensed, such as a product, an activity, a data set or a system?
    why: Volere's legal section asks "Might any pending legislation affect the development of this system?" A yes creates the regulator as a party.
    severity: normal
    blocks: [decision]
    creates: party
    mentions: [licence/licences, license/licenses/licensed/licensing]
    mention_why:
      licence: The British spelling of license; both are matched.
      license: A license names a regulator or a licensor, and that body is a party. The verb forms count too, such as a licensed activity or a product being licensed.
    group: existence

  - id: Q-REG-03
    area: REG
    scope: party
    trigger: "relationship: regulator"
    question: What must this regulator approve, be told, or see before the change goes live?
    why: A regulator has power and legitimacy over the initiative whether or not anyone names it (Mitchell, Agle and Wood, 1997, on stakeholder salience).
    severity: normal
    blocks: [decision, epic]

  - id: Q-REG-04
    area: REG
    scope: party
    trigger: "relationship: customer group"
    question: What has this group been promised today, in contracts, terms or law?
    why: Consumer rights attach to what was promised at sale, e.g. EU 2021/782 for rail, so a change to a product changes what the seller owes.
    severity: normal

  # ---------------------------------------------------------------- operations and people
  - id: Q-OPS-01
    area: OPS
    scope: app
    trigger: change in [new, changed]
    question: Who runs it out of hours, and what is its support model?
    why: Every system implies an operator slot (Alexander's onion model), and an empty slot is owed, not assumed.
    severity: normal
    blocks: [app]

  - id: Q-OPS-02
    area: OPS
    scope: contract
    trigger: change in [new, changed, new consumers]
    question: What happens to each consumer when the provider is down or slow?
    why: Volere asks about each neighbor on the context diagram; a contract is an edge to one, and its consumers depend on it.
    severity: normal
    blocks: [contract]

  - id: Q-OPS-03
    area: OPS
    scope: capability
    trigger: change in [new, extend, replace, narrow, retire]
    question: Which team owns it after the change?
    why: Enterprise-architecture practice gives each capability one owning team and one place on a shared map (Buckl et al., 2009), so a changed capability needs an owner before the map can decide anything.
    severity: normal
    blocks: [capability, epic]

  - id: Q-OPS-04
    area: OPS
    scope: initiative
    trigger: exists
    question: Is there more than one system, scheme, map or team doing the same job? Name them.
    why: Buckl et al. (2009) warn of "emotional tit-for-tat decisions" when overlapping capabilities are settled. The simulated runs never asked which of two overlapping things decides.
    severity: normal
    blocks: [decision]

  - id: Q-OPS-05
    area: OPS
    scope: initiative
    trigger: exists
    question: What is being retired, and who still depends on it?
    why: Baseline-against-target gap analysis (TOGAF) treats each retirement as a gap that someone downstream may still rely on.
    severity: normal

  - id: Q-OPS-06
    area: OPS
    scope: initiative
    trigger: exists
    question: Who is affected by this change but not yet in the room, and who wants something different from it?
    why: '"Failure to recognize stakeholders results in missing requirements" (Volere). In the simulated runs the assistant never named a stakeholder first, and in the trading run it asked after only one of four people who each wanted something different.'
    severity: normal

  - id: Q-OPS-07
    area: OPS
    scope: initiative
    trigger: exists
    question: Which beliefs does the plan rest on that no source supports, and which one would change the plan most if it were wrong?
    why: RAND assumption-based planning names the load-bearing assumptions and a signpost for each. The simulated leads held beliefs they never stated.
    severity: normal
    blocks: [decision]
