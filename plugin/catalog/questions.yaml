# The question catalogue. Code reads it to work out which questions a vault owes: `planner questions`
# applies each entry once per subject its trigger matches, and `planner check` reads the answers in the
# ledger on 11-unknowns-and-risks.md. The model only decides how to ask. The format is in CONVENTIONS.md
# under "Questions and the ledger".
#
# Every entry cites the `why` that earned it a place: a regulation, a practice, or a miss in a simulated
# session. The research is in docs/research/2026-10-06-deterministic-elicitation.md. Keep the catalogue
# small. Add an entry when a gap was found late or by luck, and prune one that nearly always ends
# not-applicable (`planner questions --stats` counts them). Bump `version` when entries change meaning.
version: 1

areas:
  FIN: Finance and liabilities
  DAT: Data and lawful basis
  PTN: Partners and contracts
  REG: Regulation and liability
  OPS: Operations and people

entries:
  # ---------------------------------------------------------------- finance and liabilities
  - id: Q-FIN-01
    area: FIN
    scope: initiative
    trigger: exists
    question: Does anyone hold value on customers' behalf, such as points, credits, balances, vouchers or deposits?
    why: Three simulated full runs never asked about the loyalty balances, so a liability went unplanned. A yes creates the stored-value subject that Q-FIN-03 and Q-FIN-04 need.
    severity: high
    blocks: [decision, epic]
    creates: stored-value
    mentions: [points, balance, balances, credit, credits, voucher, vouchers, deposit, deposits]

  - id: Q-FIN-02
    area: FIN
    scope: initiative
    trigger: exists
    question: Who pays for the change, and who carries its running cost once it is live?
    why: Buckl et al. (2009) found that existing contracts and running costs shape the post-merger state; the simulated runs never named who carries what.
    severity: normal

  - id: Q-FIN-03
    area: FIN
    scope: stored-value
    trigger: exists
    question: Who carries these balances on the books as money owed to customers, and what happens to them at conversion, expiry or closure?
    why: Loyalty credit is deferred revenue, and breakage is recognised only when redemption becomes remote (RSM UK on IFRS 15). The simulated runs missed this liability every time.
    severity: high
    blocks: [decision, capability, epic]

  - id: Q-FIN-04
    area: FIN
    scope: stored-value
    trigger: exists
    question: If the holder changes or two schemes combine, how does one balance convert into the other, and who sets the rate?
    why: The accounting for loyalty schemes "may depend on the details of the scheme" (RSM UK), so a merger of schemes is a finance decision before it is a system one.
    severity: normal
    blocks: [decision]

  # ---------------------------------------------------------------- data and lawful basis
  - id: Q-DAT-01
    area: DAT
    scope: initiative
    trigger: exists
    question: Will any data be used by a new party, or for a purpose other than the one it was collected for?
    why: The ICO's guidance on data sharing after a merger says to "establish the purposes for which the data was originally obtained" and the lawful basis for sharing it. A yes creates the party subject.
    severity: high
    blocks: [decision, contract, epic]
    creates: party

  - id: Q-DAT-02
    area: DAT
    scope: app
    trigger: change in [new, changed]
    question: What customer data does it hold or receive, and on what lawful basis may it use that data?
    why: The ICO asks for a lawful basis for each new use of personal data. Each new or changed app is a new use until someone says otherwise.
    severity: high
    blocks: [app, contract, epic]

  - id: Q-DAT-03
    area: DAT
    scope: contract
    trigger: change in [new, changed, new consumers]
    question: Does customer data cross this boundary, and were its consumers named when the data was collected?
    why: The ICO says to "consider when and how you will inform data subjects". A new consumer of a contract is a new recipient of whatever data crosses it.
    severity: normal
    blocks: [contract]

  - id: Q-DAT-04
    area: DAT
    scope: stored-value
    trigger: exists
    question: Which system is the record of each customer's balance, and does every channel that shows it read that one?
    why: Discover's read-backs in the simulated runs found balances that had to follow a customer across two systems when only one side had a place for them.
    severity: normal
    blocks: [capability]

  # ---------------------------------------------------------------- partners and contracts
  - id: Q-PTN-01
    area: PTN
    scope: initiative
    trigger: exists
    question: Does ownership, operation or payment change for anything, such as a system, an agreement, a team or a service?
    why: Change-of-control clauses can fire even when no asset moves (Weil; legal due-diligence practice). A yes creates the party subject that Q-PTN-02 and Q-PTN-03 need.
    severity: high
    blocks: [decision, contract, epic]
    creates: party
    mentions: [clause, clauses]

  - id: Q-PTN-02
    area: PTN
    scope: party
    trigger: relationship in [partner, supplier]
    question: Does their agreement let us share data with a new owner, assign the agreement, or change who controls it, and what notice does it need?
    why: Anti-assignment and change-of-control clauses decide whether a merger may use a partner's data at all. The simulated runs missed partner contracts that blocked sharing.
    severity: high
    blocks: [decision, contract, epic]

  - id: Q-PTN-03
    area: PTN
    scope: party
    trigger: relationship in [partner, supplier]
    question: Who holds the agreement, when does it end, and what does leaving or changing it cost?
    why: Buckl et al. (2009) found that existing contracts "have a high influence on costs" in the post-merger state.
    severity: normal
    blocks: [decision]

  - id: Q-PTN-04
    area: PTN
    scope: contract
    trigger: "provider: external"
    question: Which agreement with the external provider covers this contract, and does the change stay inside it?
    why: A contract with an outside provider is bounded by an agreement the initiative does not own (Volere, "changes in the other organizations or systems on your context diagram").
    severity: normal
    blocks: [contract]

  # ---------------------------------------------------------------- regulation and liability
  - id: Q-REG-01
    area: REG
    scope: initiative
    trigger: exists
    question: Will anything be sold or promised across parties, such as a combined ticket or a bundle, and who is liable to the customer when one part fails?
    why: Under EU Regulation 2021/782, carriers that form a "sole undertaking" must sell through-tickets, so a change of ownership can create passenger-rights liability. The simulated runs missed liability for combined products.
    severity: normal
    blocks: [decision, epic]

  - id: Q-REG-02
    area: REG
    scope: initiative
    trigger: exists
    question: Is anything in scope regulated or licensed, such as a product, an activity, a data set or a system?
    why: Volere's legal section asks "Might any pending legislation affect the development of this system?" A yes creates the regulator as a party.
    severity: normal
    blocks: [decision]
    creates: party
    mentions: [licence, licences, license, licenses]

  - id: Q-REG-03
    area: REG
    scope: party
    trigger: "relationship: regulator"
    question: What must this regulator approve, be told, or see before the change goes live?
    why: A regulator has power and legitimacy over the initiative whether or not anyone names it (Mitchell, Agle and Wood, 1997, on stakeholder salience).
    severity: normal
    blocks: [decision, epic]

  - id: Q-REG-04
    area: REG
    scope: party
    trigger: "relationship: customer group"
    question: What has this group been promised today, and does the change alter it?
    why: Passenger and consumer rights attach to what was promised at sale (EU Regulation 2021/782), so a change to a product changes what the operator owes.
    severity: normal

  # ---------------------------------------------------------------- operations and people
  - id: Q-OPS-01
    area: OPS
    scope: app
    trigger: change in [new, changed]
    question: Who runs it out of hours, and what is its support model?
    why: Every system implies an operator slot (Alexander's onion model), and an empty slot is owed, not assumed.
    severity: normal
    blocks: [app]

  - id: Q-OPS-02
    area: OPS
    scope: contract
    trigger: change in [new, changed, new consumers]
    question: What happens to each consumer when the provider is down or slow?
    why: Volere asks about each neighbour on the context diagram; a contract is an edge to one, and its consumers depend on it.
    severity: normal
    blocks: [contract]

  - id: Q-OPS-03
    area: OPS
    scope: capability
    trigger: change in [new, extend, replace, narrow, retire]
    question: Which team owns it after the change, and which capability map does it sit in?
    why: Post-merger EA practice maps both companies onto one domain framework first (Buckl et al., 2009), so a changed capability needs an owner on the map that decides.
    severity: normal
    blocks: [capability, epic]

  - id: Q-OPS-04
    area: OPS
    scope: initiative
    trigger: exists
    question: Is there more than one of anything doing the same job, such as two systems, two schemes or two capability maps, and which one decides, or is it a new one?
    why: Buckl et al. (2009) warn of "emotional tit-for-tat decisions" between two companies' capabilities. The simulated runs never asked which capability framework decides.
    severity: normal
    blocks: [decision]

  - id: Q-OPS-05
    area: OPS
    scope: initiative
    trigger: exists
    question: What is being retired, and who still depends on it?
    why: Baseline-against-target gap analysis (TOGAF, EA merger practice) treats each retirement as a gap that someone downstream may still rely on.
    severity: normal

  - id: Q-OPS-06
    area: OPS
    scope: initiative
    trigger: exists
    question: Who is affected by this change but not yet in the room?
    why: '"Failure to recognize stakeholders results in missing requirements" (Volere). In the simulated runs the assistant never named a stakeholder first.'
    severity: normal

  - id: Q-OPS-07
    area: OPS
    scope: initiative
    trigger: exists
    question: Which beliefs does the plan rest on that no source supports, and which one would change the plan most if it were wrong?
    why: RAND assumption-based planning names the load-bearing assumptions and a signpost for each. The simulated leads held beliefs they never stated.
    severity: normal
    blocks: [decision]
