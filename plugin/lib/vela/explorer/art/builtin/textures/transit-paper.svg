<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 864" width="1536" height="864" preserveAspectRatio="xMidYMid slice">
  <title>Aged transit-map paper (procedural)</title>
  <defs>
    <filter id="mottle" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".0035 .005" numOctaves="4" seed="9"/>
      <feColorMatrix values="0 0 0 0 .62  0 0 0 0 .5  0 0 0 0 .32  .9 0 0 0 -.3"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="4"/>
      <feColorMatrix values="0 0 0 0 .4  0 0 0 0 .32  0 0 0 0 .2  0 0 0 .22 0"/></filter>
    <radialGradient id="vig" cx="50%" cy="50%" r="75%"><stop offset=".55" stop-color="#8a6a3a" stop-opacity="0"/><stop offset="1" stop-color="#8a6a3a" stop-opacity=".22"/></radialGradient>
    <radialGradient id="fox"><stop offset="0" stop-color="#9c7444" stop-opacity=".22"/><stop offset="1" stop-color="#9c7444" stop-opacity="0"/></radialGradient>
    <linearGradient id="vcrease" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".45" stop-color="#fffaf0" stop-opacity=".22"/><stop offset=".55" stop-color="#7a5e36" stop-opacity=".12"/><stop offset="1" stop-color="#7a5e36" stop-opacity="0"/></linearGradient>
    <linearGradient id="hcrease" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".45" stop-color="#fffaf0" stop-opacity=".22"/><stop offset=".55" stop-color="#7a5e36" stop-opacity=".12"/><stop offset="1" stop-color="#7a5e36" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1536" height="864" fill="#f1e8d4"/>
  <rect width="1536" height="864" filter="url(#mottle)" opacity=".55"/>
  <rect width="1536" height="864" filter="url(#grain)"/>
  <rect x="505" width="14" height="864" fill="url(#vcrease)"/><rect x="1017" width="14" height="864" fill="url(#vcrease)"/>
  <rect y="425" width="1536" height="14" fill="url(#hcrease)"/>
  <circle cx="212" cy="138" r="18" fill="url(#fox)"/><circle cx="1290" cy="704" r="26" fill="url(#fox)"/><circle cx="1350" cy="120" r="12" fill="url(#fox)"/>
  <circle cx="160" cy="760" r="34" fill="url(#fox)"/><circle cx="702" cy="790" r="10" fill="url(#fox)"/>
  <rect width="1536" height="864" fill="url(#vig)"/>
</svg>
