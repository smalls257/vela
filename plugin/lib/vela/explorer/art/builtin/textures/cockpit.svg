<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 864" width="1536" height="864" preserveAspectRatio="xMidYMid slice">
  <title>Matte cockpit instrument-panel surface (procedural)</title>
  <defs>
    <filter id="powder" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 .8  0 0 0 0 .82  0 0 0 0 .86  0 0 0 .07 0"/></filter>
    <filter id="brush" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".0015 .45" numOctaves="2" seed="2"/>
      <feColorMatrix values="0 0 0 0 .7  0 0 0 0 .74  0 0 0 0 .8  .5 0 0 0 -.18"/></filter>
    <radialGradient id="vig" cx="50%" cy="45%" r="75%"><stop offset=".4" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient>
    <radialGradient id="screw" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#4a5058"/><stop offset=".7" stop-color="#2a2e34"/><stop offset="1" stop-color="#15171a"/></radialGradient>
    <g id="s"><circle r="9" fill="#111316"/><circle r="7" fill="url(#screw)"/><path d="M-4.5 -1 H4.5 V1 H-4.5 Z" fill="#101215" transform="rotate(35)"/></g>
  </defs>
  <rect width="1536" height="864" fill="#1c1f23"/>
  <rect width="1536" height="864" filter="url(#brush)" opacity=".35"/>
  <rect width="1536" height="864" filter="url(#powder)"/>
  <g fill="none" stroke-width="2"><path d="M0 120 H1536 M0 744 H1536" stroke="#0e1012"/><path d="M0 122 H1536 M0 746 H1536" stroke="#2c3036" opacity=".7"/></g>
  <use href="#s" x="40" y="40"/><use href="#s" x="1496" y="40"/><use href="#s" x="40" y="824"/><use href="#s" x="1496" y="824"/>
  <use href="#s" x="768" y="40"/><use href="#s" x="768" y="824"/>
  <rect width="1536" height="864" fill="url(#vig)"/>
