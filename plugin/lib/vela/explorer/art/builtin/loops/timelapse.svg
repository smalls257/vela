<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid slice">
  <title>A seed growing into a branch (procedural loop, 5 s)</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#2a2a1e"/><stop offset="1" stop-color="#0f0e0a"/></radialGradient>
    <radialGradient id="light" cx="50%" cy="20%" r="50%"><stop offset="0" stop-color="#ffe9b8" stop-opacity=".25"/><stop offset="1" stop-color="#ffe9b8" stop-opacity="0"/></radialGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b2c1e"/><stop offset="1" stop-color="#17110b"/></linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b9d68a"/><stop offset="1" stop-color="#5f8f45"/></linearGradient>
    <path id="leafshape" d="M0 0 C18 -26 58 -30 84 -8 C58 14 18 16 0 0 Z"/>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <rect width="960" height="540" fill="url(#light)"/>
  <ellipse cx="480" cy="560" rx="560" ry="120" fill="url(#soil)"/>
  <g>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.86;.96;1" dur="5s" repeatCount="indefinite"/>
    <ellipse cx="480" cy="444" rx="13" ry="9" fill="#a07a4a" transform="rotate(-18 480 444)"/>
    <path d="M480 444 C478 400 468 360 476 318 C484 276 506 250 520 214" fill="none" stroke="#8fbf62" stroke-width="7" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
      <animate attributeName="stroke-dashoffset" values="1;1;0;0" keyTimes="0;.12;.6;1" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.4 0 .2 1;0 0 1 1"/>
    </path>
    <path d="M474 336 C450 316 430 300 404 292" fill="none" stroke="#8fbf62" stroke-width="5" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
      <animate attributeName="stroke-dashoffset" values="1;1;0;0" keyTimes="0;.4;.7;1" dur="5s" repeatCount="indefinite"/>
    </path>
    <g transform="translate(520 214) rotate(-60)"><use href="#leafshape" fill="url(#leaf)" transform="scale(0)">
      <animateTransform attributeName="transform" type="scale" values="0;0;1;1" keyTimes="0;.55;.75;1" dur="5s" repeatCount="indefinite"/></use></g>
    <g transform="translate(404 292) rotate(-160)"><use href="#leafshape" fill="url(#leaf)" transform="scale(0)">
      <animateTransform attributeName="transform" type="scale" values="0;0;.85;.85" keyTimes="0;.65;.82;1" dur="5s" repeatCount="indefinite"/></use></g>
    <g transform="translate(478 380) rotate(-10)"><use href="#leafshape" fill="url(#leaf)" transform="scale(0)">
      <animateTransform attributeName="transform" type="scale" values="0;0;.7;.7" keyTimes="0;.45;.65;1" dur="5s" repeatCount="indefinite"/></use></g>
  </g>
</svg>
