<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid slice">
  <title>Light moving along lines at night (procedural loop, 4 s)</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="55%" r="80%"><stop offset="0" stop-color="#14204a"/><stop offset="1" stop-color="#060a1c"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="haze" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="3"/></filter>
    <radialGradient id="spark"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <path id="l1" d="M-40 420 C180 420 260 300 420 300 S700 180 1000 180"/>
    <path id="l2" d="M-40 140 C200 140 300 260 480 270 S760 380 1000 380"/>
    <path id="l3" d="M200 -40 C220 160 340 230 480 270 S560 470 620 580"/>
    <path id="l4" d="M-40 300 C160 300 300 470 520 470 S820 420 1000 470"/>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <g fill="#9fb4ff" opacity=".18" filter="url(#haze)">
    <circle cx="90" cy="70" r="2"/><circle cx="300" cy="520" r="3"/><circle cx="820" cy="90" r="2"/><circle cx="700" cy="250" r="2.5"/><circle cx="880" cy="520" r="2"/><circle cx="560" cy="60" r="2"/>
  </g>
  <g fill="none" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)" opacity=".85">
    <use href="#l1" stroke="#e0a43c"/><use href="#l2" stroke="#3fb7a6"/><use href="#l3" stroke="#e2607a"/><use href="#l4" stroke="#7d8cff"/>
  </g>
  <g fill="#0b1230" stroke="#f6efe0" stroke-width="3"><circle cx="480" cy="270" r="9"/><circle cx="420" cy="300" r="6"/><circle cx="520" cy="470" r="6"/></g>
  <g filter="url(#glow)">
    <circle r="7" fill="url(#spark)"><animateMotion dur="4s" repeatCount="indefinite"><mpath href="#l1"/></animateMotion></circle>
    <circle r="6" fill="url(#spark)"><animateMotion dur="4s" begin="-2s" repeatCount="indefinite"><mpath href="#l1"/></animateMotion></circle>
    <circle r="7" fill="url(#spark)"><animateMotion dur="4s" begin="-1s" repeatCount="indefinite"><mpath href="#l2"/></animateMotion></circle>
    <circle r="6" fill="url(#spark)"><animateMotion dur="4s" begin="-3s" repeatCount="indefinite"><mpath href="#l2"/></animateMotion></circle>
    <circle r="6" fill="url(#spark)"><animateMotion dur="4s" begin="-0.5s" repeatCount="indefinite"><mpath href="#l3"/></animateMotion></circle>
    <circle r="7" fill="url(#spark)"><animateMotion dur="4s" begin="-2.6s" repeatCount="indefinite"><mpath href="#l4"/></animateMotion></circle>
  </g>
  <circle cx="480" cy="270" r="9" fill="none" stroke="#f6efe0" stroke-width="2">
    <animate attributeName="r" values="9;26" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
