<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid slice">
  <title>Dark cockpit: indicator lights breathing on a matte panel (procedural loop, 4 s)</title>
  <defs>
    <radialGradient id="vig" cx="50%" cy="50%" r="70%"><stop offset=".3" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".7"/></radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="1" numOctaves="2" seed="7"/><feColorMatrix values="0 0 0 0 .8 0 0 0 0 .8 0 0 0 0 .85 0 0 0 .06 0"/></filter>
    <filter id="bloom" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="dof" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>
  <rect width="960" height="540" fill="#16181b"/>
  <rect width="960" height="540" filter="url(#grain)"/>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;-36 0;0 0" dur="8s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
    <g fill="#0d0f11" stroke="#262a30" stroke-width="2"><rect x="80" y="150" width="260" height="120" rx="10"/><rect x="380" y="150" width="260" height="120" rx="10"/><rect x="680" y="150" width="260" height="120" rx="10"/><rect x="200" y="320" width="560" height="90" rx="10"/></g>
    <g filter="url(#dof)">
      <g filter="url(#bloom)">
        <rect x="120" y="196" width="34" height="12" rx="3" fill="#3fdc8c"><animate attributeName="opacity" values=".35;1;.35" dur="4s" repeatCount="indefinite"/></rect>
        <rect x="170" y="196" width="34" height="12" rx="3" fill="#3fdc8c" opacity=".3"/>
        <rect x="430" y="196" width="34" height="12" rx="3" fill="#f2a83b"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></rect>
        <rect x="480" y="196" width="34" height="12" rx="3" fill="#3fdc8c" opacity=".28"/>
        <rect x="730" y="196" width="34" height="12" rx="3" fill="#3fdc8c" opacity=".28"/>
        <rect x="780" y="196" width="34" height="12" rx="3" fill="#3fdc8c"><animate attributeName="opacity" values=".3;.3;1;.3" keyTimes="0;.5;.75;1" dur="4s" repeatCount="indefinite"/></rect>
        <circle cx="260" cy="365" r="6" fill="#3fdc8c" opacity=".3"/><circle cx="300" cy="365" r="6" fill="#3fdc8c" opacity=".3"/>
        <circle cx="480" cy="365" r="7" fill="#f2a83b"><animate attributeName="opacity" values=".2;.9;.2" dur="4s" begin="-1s" repeatCount="indefinite"/></circle>
        <circle cx="660" cy="365" r="6" fill="#3fdc8c" opacity=".3"/><circle cx="700" cy="365" r="6" fill="#3fdc8c"><animate attributeName="opacity" values=".25;.8;.25" dur="4s" begin="-2.5s" repeatCount="indefinite"/></circle>
      </g>
    </g>
  </g>
  <rect width="960" height="540" fill="url(#vig)"/>
</svg>
