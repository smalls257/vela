<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 864" width="1536" height="864" preserveAspectRatio="xMidYMid slice">
  <title>Soft botanical-garden backdrop (procedural)</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3f1e4"/><stop offset="1" stop-color="#e2e9d6"/></linearGradient>
    <radialGradient id="sun" cx="22%" cy="8%" r="60%"><stop offset="0" stop-color="#fff8e2" stop-opacity=".9"/><stop offset="1" stop-color="#fff8e2" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="softer" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="3"/>
      <feColorMatrix values="0 0 0 0 .3  0 0 0 0 .38  0 0 0 0 .28  0 0 0 .12 0"/></filter>
    <g id="leaf"><path d="M0 0 C40 -60 140 -70 220 0 C140 70 40 60 0 0 Z"/></g>
  </defs>
  <rect width="1536" height="864" fill="url(#sky)"/>
  <g filter="url(#softer)" opacity=".55">
    <rect x="-40" y="-40" width="1616" height="80" fill="#c9d6bd"/>
    <rect x="300" y="-40" width="40" height="944" fill="#d6dfc9"/><rect x="760" y="-40" width="40" height="944" fill="#d6dfc9"/><rect x="1220" y="-40" width="40" height="944" fill="#d6dfc9"/>
  </g>
  <g filter="url(#soft)">
    <g fill="#9fb58e" opacity=".75">
      <use href="#leaf" transform="translate(-60 120) rotate(25) scale(1.6)"/><use href="#leaf" transform="translate(-40 420) rotate(-15) scale(1.9)"/>
      <use href="#leaf" transform="translate(40 760) rotate(-40) scale(2.1)"/><use href="#leaf" transform="translate(1600 160) rotate(160) scale(1.8)"/>
      <use href="#leaf" transform="translate(1590 520) rotate(200) scale(2)"/><use href="#leaf" transform="translate(1440 900) rotate(235) scale(2.2)"/>
    </g>
    <g fill="#7f9a72" opacity=".5">
      <use href="#leaf" transform="translate(120 880) rotate(-70) scale(2.4)"/><use href="#leaf" transform="translate(1300 -40) rotate(120) scale(1.5)"/>
      <use href="#leaf" transform="translate(-80 260) rotate(5) scale(1.2)"/><use href="#leaf" transform="translate(1610 360) rotate(185) scale(1.3)"/>
    </g>
    <g fill="#c7d4a8" opacity=".7">
      <use href="#leaf" transform="translate(200 -30) rotate(70) scale(1.1)"/><use href="#leaf" transform="translate(1180 880) rotate(-110) scale(1.4)"/>
    </g>
  </g>
  <rect width="1536" height="864" fill="url(#sun)"/>
  <rect width="1536" height="864" filter="url(#grain)"/>
</svg>
