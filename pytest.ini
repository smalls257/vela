[pytest]
# Keep only the last run's temp folders, and only for failed tests. Each test copies whole vaults into tmp_path;
# with several suites running in parallel all day, pytest's default (keep every test's folder for 3 runs) filled
# the disk on 2026-10-14 (hundreds of GB under $TMPDIR/pytest-of-<user>), and the suite then failed with ENOSPC.
tmp_path_retention_count = 1
tmp_path_retention_policy = failed
