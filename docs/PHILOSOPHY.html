</script></head><body><div id=d></div><script>document.getElementById('d').innerHTML=marked.parse("# Why the planner is built the way it is\n\nThis is the reasoning behind proj-planner, for someone who knows the commands and wants to know why they work the way they do. The [README](../README.md) covers the how. The design history is in [`design-sessions/`](design-sessions/), 01 to 11 in order, and the evidence is in [`research/`](research/).\n\n## The problem\n\nAn initiative usually arrives as one line from an executive. \"One customer, one journey, one account across ferry and rail by next summer.\" \"An AI coach that teaches people to trade one stock or option at a time, and trades for them when they're ready.\" Those are the openings of two of the simulator's personas, and the next thing each one says is just as typical: nobody has said what any of it means. From that line the solution lead has to produce apps, the contracts between them, and epics a team senior can build from, while answers come in over months.\n\nWe tried this with an existing tool (wayfinder), and the [original spec](superpowers/specs/2026-10-03-initiative-planner-design.md) lists how it failed. It worked at the wrong altitude: requirements and design were mixed, and one diagram showed 30 apps with 15 layers each. The output had to be reworked by hand before anyone could use it. Nobody could tell which lines came from a person, which from the code and which from the model. The prose read as slop. And initiative work doesn't converge the way an epic does, so a session built to drive towards `status: complete` is the wrong tool.\n\nThe simulator later showed two more failures. A chat answers what it is asked, and the questions that sink a merger are the ones nobody in the room thinks of, such as who carries the loyalty points as a liability. A question nobody asked leaves no trace. And loose docs remember what was raised but never move on: an unknown answered in week three stays open on the page unless something closes it.\n\nSo the toolkit is a vault (one Markdown repo per initiative), a CLI that checks it and renders its generated parts, and session skills, one per kind of conversation. The rest of this file is about why each looks the way it does.\n\n## What it believes\n\n**Code decides what is owed, and prose only says how to ask it.** The first versions put elicitation in skill prose: Dump ran a \"concern sweep\", Discover named \"implications\". A probe could make that prose pass, and the next run would miss again. Across three simulated full runs of the merger the same gaps kept slipping: stored value as a liability, partner contracts that block data sharing, liability for combined products, which capability framework decides, unstated beliefs, and stakeholders the assistant never named first. [Design 09](design-sessions/09-question-catalogue.md) called this a Paper Tiger and a Black Box, and each name produced a different half of the fix.\n\nA Paper Tiger passes the probe and fails the need, so the rule has to live where a run can't skip it. The [question catalogue](../plugin/catalog/questions.yaml) is data: 29 entries in five focus areas, each citing the regulation, practice or simulated miss that earned it a place. `planner questions` applies each entry once to every subject it fits, so typing a new party or stored value makes its questions owed without anyone remembering them. A Black Box means a skipped question is invisible, so every owed copy must end in a row on the question ledger, with evidence `check` verifies. `answered` needs the item and a source, and a quoted source must really be on the page it names. `assumed` needs the belief, whether it is load-bearing, and a signpost that would show it failing, a shape taken from RAND's assumption-based planning. `not-applicable` means it does not apply, never \"not yet\": a reason that says \"for now\" or \"pending\" is E802.\n\nThe [research](research/2026-10-06-deterministic-elicitation.md) found a hole before this shipped. A trigger only fires on a subject someone typed, so if nobody types the loyalty programme the checker reports nothing owed. That is a Silent Fallback at the extraction step, and it would make an empty ledger look clean. Hence the existence questions owed at initiative scope regardless (\"Does anyone hold value on customers' behalf?\"), whose yes creates the subject, and W809, which warns when a page mentions points or a licence that nobody has typed. The gates read the ledger at the end of Shape, at each Grill item and before epics. Even so, the coverage line never says \"complete\", only what is owed and undisposed against catalogue v1. A catalogue can only be complete against itself.\n\n**Only a Grill decides, and the user may override anything, provided it is recorded.** Every item carries a state: `inkling`, `assumption`, `fact`, `decided` or `unknown`. Every mode but Grill writes at most `assumption`, and `check` fails a `decided` item whose decision doesn't link to a Grill. This guards against a session's guess becoming a \"decision\"; the first check of the example vault found 20 pages using `decided` for facts. A Grill asks one question at a time with a recommended answer, holds the recommendation under pushback until it hears a reason, and never answers its own questions.\n\nBut a tool that refuses is a tool the lead routes around. In one run the simulated lead would not override a gate on the login owner, though the CIO had written not to let open questions hold up the start, and the run stopped at its first Grill. So [START](../plugin/references/START.md) holds one shared rule: the user may override any rule. Claude says once what the rule protects, does what was asked, and writes an `**Override:**` bullet with the rule, who, when and why. It never refuses and never asks twice, and `check` reports the overridden error as a warning that quotes it. A few hard stops sit outside this: nothing under `~/.claude`, no company material committed without consent, no claiming a PR exists unless the tool printed it, no invented words, sources or IDs. The split is deliberate. Process rules protect the quality of the plan, and that trade is the lead's. Hard stops protect whether the record is true, and nobody trades that.\n\n**Fresh-context focused reviewers, not personas.** The tempting design is a room of agents playing the CFO, the DPO and the regulator. The [research](research/2026-10-06-personas-vs-focused-contexts.md) says identity adds nothing measurable to accuracy. One study found irrelevant persona detail can cost about 30 points. What helps is a short clean context, an explicit scope, areas split centrally (independent agents without a split duplicate each other), and results combined by union, because voting and debate delete the lone finding.\n\nSo each review checkpoint dispatches one read-only area reviewer per focus area, given the written pages and its area's owed questions and none of the conversation. The isolation is also a test: if a reviewer can't see something, the plan doesn't say it. `planner findings merge` combines the replies in code. It keeps the union, folds duplicates, drops any finding whose quote isn't on the page it cites, and never votes. Each area reports found, checked and none, or did not run, and [REVIEW.md](../plugin/references/REVIEW.md) forbids writing an empty list for a reviewer that crashed, because that would read as clean. \"FIN\" and \"DAT\" are labels for the lead, not characters.\n\n**Ask the lead first, and never draft emails for them.** The natural assistant move with an unknown is to offer to write the chase, and one run's scorecard counted eight messages drafted for the lead to send. [MODES](../plugin/references/MODES.md) now says that before an unknown waits on anyone, Claude asks the lead whether they know the answer and how. A first-hand answer is a source with its own row in `sources.md`. The owner and ask-by date record who is asked and by when; the asking is the lead's. When everything is blocked, the session says so once, offers the override, and stops rather than filling the time. The simulator counts drafted messages in code now, and the runs since have had none.\n\n**Unknowns are owned and dated, and get resolved when answers arrive.** Every unknown has an owner's handle, an ask-by date and what it blocks. The [landscape research](research/2026-10-03-initiative-planning-landscape.md) found that registers stay alive only when something outside them forces a review, so every session opens with the overdue ones and a weekly issue lists them. That wasn't enough. The trading run ended with 39 open unknowns, most of them answered by news the lead already had, because nothing told any mode to resolve one. Now an answered unknown is written `resolved`, with an outcome that links its source and the session that settled it, and Discover checks open unknowns and owed questions against everything it reads.\n\n**Docs read as current state.** The trading run's vault read as a log: empty constraint and capability pages, bullets where prose was expected, generated boxes at the top, \"(SRC-04)\" everywhere, decision history above the description. [Design 10](design-sessions/10-docs-read-as-current-state.md) turned it round. A page opens with prose saying what is true now, and close rewrites that opening for every page a session changed, replacing it rather than appending. Links go on the words, not on IDs. History goes under `## History` at the end, folded in the viewer. The readers are the CIO and the seniors. A page that reads as a log makes them reconstruct the present from its history, which is Forensic Coding handed to the reader. The v1 rule belongs with this one: state a value once and link to it elsewhere, because a contract written on three pages drifts three ways.\n\n**Deterministic checks over prose instructions, wherever possible.** In Claude Code, instruction files are context, not enforced configuration. So wherever a rule can be checked, it is. `check` is read-only and runs as a required PR check. `render` owns every generated block, and a hand edit inside one is an error. `voicecheck` throws out a rewrite that lost or moved an ID, number, date or negation. `handoff verify` exits 1 when something a senior accepted has changed. A challenge PR stays red on purpose. When a mechanism replaces some prose, the prose goes. What stays in prose is what can't be checked: how to ask, in what order, in what tone.\n\n## The shape of the work\n\nThe modes run roughly in this order, each with a narrow licence; the [MODES table](../plugin/references/MODES.md) is what the evals grade.\n\n- **Dump** gets everything out. It pushes back on nothing, labels Claude's ideas `(claude)`, ends with a pre-mortem that assumes failure, and writes no page until close.\n- **Discover** reads sources, shows \"here's what I think exists\" for correction, and cites a source for every fact. General knowledge is never a source.\n- **Shape** offers two or three options, each with what must be true for it to work, and records the rejected ones with reasons.\n- **Grill** decides.\n- **Requirements** writes functional requirements per capability. They name no apps, so Boundary can test its cuts against them.\n- **Boundary** offers two or three cuts into apps, reads back one sheet per app, and writes only the lines the lead said yes to.\n- **Allocate** divides each requirement among apps and the contracts that carry it, proposing a contract where a crossing has none. [Design 11](design-sessions/11-requirements-flowdown.md) specifies it and it is being built now.\n- **Epics** works from the traceability gaps, with acceptance criteria at a contract or flow boundary that never name a component.\n- **Handoff** writes a hashed manifest of everything the senior accepts.\n\nClose runs after every session: it marks each capture keep, park or drop, writes pages and ledger rows, drafts prose in the house voice, has a fresh reviewer read it, renders, checks and opens the PR.\n\nSeveral modes exist because a run stalled where they should have been. No mode wrote an app page until Boundary, so every run stopped exactly where the direction should have become apps, and epics, handoff and the app-level questions had nothing to work on. No mode wrote flows, ADRs or glossary terms until Boundary and close were told to. Allocation came from the Coach design run, whose requirements covered one of its app's four capabilities and whose drafts piled up in a folder for someone to copy into the vault by hand.\n\nThe vault and the team's repo are separate on purpose, and the line is the altitude rule from the [session review](research/2026-10-03-session-review.md). The vault names apps, what each does and doesn't do, and the contracts between them. It never says how an app is built, and components never appear in it. After handoff the work moves to the senior's repo, where `tech-design-grill` in vault mode reads the app's pages, checks the manifest, and traces every component to an allocated requirement, and `work-breakdown` traces every story the same way. A senior who disputes a boundary runs `/planner:challenge`, which writes an open unknown the senior owns and a `**Dissent:**` line, and opens a PR that stays red until the lead answers. It never touches the challenged item. That is the solution lead's job as it really divides: the lead owns the boundaries and contracts, the senior owns what is inside them, and a disagreement is written down rather than settled quietly.\n\n## How we know it works\n\nSingle-turn evals check that a skill follows its rules. They can't say whether it helps a lead think better than plain Claude Code. [Design 08](design-sessions/08-session-simulator.md) built a [simulator](../tests/sim/run.py) for that. A persona holds a private brief: facts the lead knows, wrong beliefs they give up only for a reason, gaps they have never thought of, conflicts, and decisions they make only after the options are read back. The gaps never reach the persona's prompt, because a gap it was never told can't leak. Real multi-turn sessions run in a scratch vault, with `gh` stubbed so every failure path runs honestly. Scripts can start from a saved vault and deliver news mid-run. A holdout persona, two hospital trusts merging outpatient booking, always runs blind, so a change that only learned one brief shows up as a drop. One-session [probes](../tests/sim/probe.py), at $1 to $3 against $36 to $55 for a full run, let a skill be edited and tested in a loop.\n\nThe scorecard had to be fixed first. The first judge read the brief, transcript and vault in one call and marked 35 of 37 items \"no\" with zero thinking tokens, while the vault plainly named FERRYMASTER and the CFO. A scorecard that passes its own validation and misses what's on the page is a Paper Tiger too. Now the judge makes one call per category and cites a turn and a quote for every yes, the driver's own keyword grep sits beside each verdict, and every disagreement goes to the top under \"Check these\". Neither is treated as proof. Mechanical detectors count what a judge would gloss over: messages drafted for the lead, persona turns that claim actions outside the chat, persona turns that quote the brief's IDs. `planner status` adds a completeness line, the mean of five ratios such as items settled and unknowns resolved: the hand-finished example reads 94%, the trading run's vault read 43%.\n\nThe runs taught more than they scored. Without Boundary, nothing became an app. Nothing resolved unknowns, so 39 sat open. The digest kept growing: reviewers raised new questions about pages the session hadn't touched, then about pages a Grill had closed, and the trading vault's reviewer questions went from 115 to 208. The merge now drops a new question that quotes a page the session didn't change, and on decided pages keeps only high-severity ones. And the simulated lead invented replies. One reported a CEO reply that no fact held; another said Shape had run, a branch was pushed and a consultant had answered, none of it real. The persona has rules against both now, and a detector flags any turn that breaks them.\n\nThe full trading run surfaced four of seven hidden gaps, challenged four of five wrong beliefs and took six of eight decisions. The three gaps it never raised were the Options Disclosure Document, the pattern-day-trader rule and early assignment on sold calls: specific brokerage rules no catalogue entry holds. That is the catalogue's stated limit, showing up exactly where it should.\n\n## Tensions that are still live\n\n**Thoroughness against a lead who is overwhelmed.** Sessions are unbounded by design, and question caps were removed because a cap hides the question it cuts. The digest copes by printing high-severity and blocking lines in full and counting the rest by area. But every fix for growth so far is a filter in code that drops questions, on the judgement that they were owed earlier. The merge lists what it drops, so it isn't a Silent Fallback in the strict sense, but a lead who never reads the \"Dropped\" line is in the same place. Whether a ranked list of 200 questions is usable at all is open.\n\n**Reviewer cost and catalogue growth.** Five subagents read the vault at every checkpoint. Design 09 capped the catalogue at about 25 entries; it holds 29, and close proposes more from every gap found late. `planner questions --stats` shows which entries keep ending not-applicable, but nobody has pruned yet. Curation that only adds is how a checklist becomes a framework.\n\n**How much to trust a simulated persona.** A simulated lead is more fluent and cooperative than a real one, and it has invented replies, quoted its own brief and repeated its worries. The judge is a model too, and sometimes refuses. The holdout guards against tuning to one brief, not against tuning to simulated leads in general. The simulator has a `baseline` arm, plain Claude Code with only the conventions, and no run in `tests/sim/results/` has used it, so Design 08's own question, whether this beats plain Claude Code, is still unanswered. The kill rule, cut back to the conventions, `check` and the viewer if it isn't faster than plain Markdown after five real sessions, can only be settled by real use.\n\n**What \"complete\" means.** The completeness line rewards settled items, so a vault can score well without ever mentioning the Options Disclosure Document, as the trading vault never did. The coverage line refuses to say \"complete\" at all. `tech-design-grill` gained `complete-with-gaps` after it marked a design complete while admitting two audit failures. The session review offered a better test: a senior can run their own design session without coming back to the lead for a week. Nothing measures that yet.\n\n**Who writes the prose.** The session review recommended Claude as interviewer, not drafter, so every factual sentence would be one the lead had said. The design went the other way: Claude drafts and people edit, with voice examples, a fresh reviewer and `voicecheck` keeping facts fixed. Design 10 then had close rewrite the opening prose of every page it changed, and one scorecard flagged opening prose drafted and committed without the lead reading it. The precision check guards facts, not judgement. Whether a lead who doesn't write the sentences still does the thinking the sentences were meant to force is the oldest open question in the repo.\n");</script></body></html>
