name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install "pyyaml>=6,<7" "pytest>=8"
      - name: Run the suite
        run: python -m pytest -q -m "not browser"
  explorer-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Install test dependencies
        run: python -m pip install "pyyaml>=6,<7" "pytest>=8"
      - name: Run browser smoke tests
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
          CI: "true"
        run: python -m pytest -q -m browser tests/test_explorer_browser.py
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install gate tools
        run: python -m pip install "pyyaml>=6,<7" "semgrep==1.157.0" "ruff==0.15.7"
      - name: Gate (rules, sync, vault checks)
        run: .githooks/gate static
