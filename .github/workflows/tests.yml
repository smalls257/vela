name: tests

# Manual only: the owner turned off runs on every push and pull request on 2026-10-21 to save Actions usage.
# Start it from the Actions tab (Run workflow) when you want it.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install "pytest>=8" "lizard==1.21.3"
      - name: Run the suite
        run: python -m pytest -q -m "not browser"
  explorer-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Install test dependencies
        run: python -m pip install "pytest>=8"
      - name: Run browser smoke tests
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
          CI: "true"
        run: python -m pytest -q -m browser tests/test_explorer_browser.py
  gates:
    runs-on: ubuntu-latest
    env:
      GATE_BASE: origin/main
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install gate tools
        run: python -m pip install "semgrep==1.157.0" "ruff==0.15.7" "lizard==1.21.3"
      - name: Gate (rules, sync, vault checks)
        run: .githooks/gate static
