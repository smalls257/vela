rules:
  # Infected Core. Every vela module except cli.py and edge/ is pure: no files, no clock, no network,
  # no process. cli.py is the one shell. edge/ is the explicit I/O boundary. Keep it that way so the core
  # passes the Airplane Test.
  # Known debt: explorer/design_data.py, draft_data.py and plan_data.py still read
  # files themselves. They are excluded by name so the rule guards every other data module; remove each
  # exclusion when its reads move to build.py.
  - id: vela-core-no-io-imports
    languages: [python]
    severity: ERROR
    message: >-
      vela's core modules take text and dates as arguments; only cli.py and edge/ touch the OS.
      Import '$MOD' in cli.py and pass the result in (Infected Core).
    paths:
      include: ["/plugin/lib/vela/*.py", "/plugin/lib/vela/explorer/*_data.py"]
      exclude: ["/plugin/lib/vela/cli.py", "/plugin/lib/vela/edge/*.py",
                "/plugin/lib/vela/explorer/design_data.py", "/plugin/lib/vela/explorer/draft_data.py",
                "/plugin/lib/vela/explorer/plan_data.py"]
    patterns:
      - pattern-either:
          - pattern: import $MOD
          - pattern: from $MOD import $NAME
      - metavariable-regex:
          metavariable: $MOD
          regex: ^(os|sys|subprocess|pathlib|shutil|tempfile|socket|time|glob|http|requests|urllib\.request)(\.|$)
  - id: vela-core-no-clock
    languages: [python]
    severity: ERROR
    message: >-
      The core never reads the clock. Take `today` as an argument; cli.py resolves it from --today
      or the system date once (Infected Core).
    paths:
      include: ["/plugin/lib/vela/*.py", "/plugin/lib/vela/explorer/*_data.py"]
      exclude: ["/plugin/lib/vela/cli.py", "/plugin/lib/vela/edge/*.py",
                "/plugin/lib/vela/explorer/design_data.py", "/plugin/lib/vela/explorer/draft_data.py",
                "/plugin/lib/vela/explorer/plan_data.py"]
    pattern-either:
      - pattern: datetime.date.today()
      - pattern: datetime.datetime.now(...)
      - pattern: datetime.datetime.utcnow()
      - pattern: datetime.datetime.today()
      - pattern: time.time()
      - pattern: date.today()
  - id: vela-core-no-file-or-stdout
    languages: [python]
    severity: ERROR
    message: >-
      The core returns values; cli.py reads files and writes output. Move this to cli.py (Infected Core).
    paths:
      include: ["/plugin/lib/vela/*.py", "/plugin/lib/vela/explorer/*_data.py"]
      exclude: ["/plugin/lib/vela/cli.py", "/plugin/lib/vela/edge/*.py",
                "/plugin/lib/vela/explorer/design_data.py", "/plugin/lib/vela/explorer/draft_data.py",
                "/plugin/lib/vela/explorer/plan_data.py"]
    pattern-either:
      - pattern: open(...)
      - pattern: print(...)
      - pattern: input(...)
      - pattern: $P.read_text(...)
      - pattern: $P.write_text(...)
      - pattern: $P.read_bytes(...)
      - pattern: $P.write_bytes(...)
