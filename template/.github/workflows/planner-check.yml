# Runs planner check on every pull request. Make the "planner-check" job a
# required status check on main, so a red check blocks the merge.
name: planner check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  planner-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: planner check
        run: python .claude/skills/planner/scripts/planner check
      - name: generated blocks are current
        run: python .claude/skills/planner/scripts/planner render && git diff --exit-code
